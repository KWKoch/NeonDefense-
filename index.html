/* ---- semi-live level preview: mobs drift, a little turret shoots them ---- */
const PV={mobs:[],bul:[],par:[],t:0,fire:0,last:0};
function pvSpawn(k,f){
  const m=MOB[k], boss=k==='boss';
  return {k:k,x:boss?0.5:0.14+Math.random()*0.72,y:f===undefined?-0.08:f,vy:boss?0.012:(0.035+Math.random()*0.03)*(m.vy>80?1.5:1),rot:Math.random()*6,hp:boss?6:1,ph:Math.random()*6,px:0,py:0,pr:20};
}
function pvInit(){
  const n=P.sel, ts=levelMobs(n).slice(); if(isBoss(n)) ts.push('boss');
  PV.mobs=ts.map((k,i)=>pvSpawn(k,0.06+(i/Math.max(1,ts.length))*0.62)); PV.bul=[]; PV.par=[]; PV.fire=0.7;
}
function pvFrame(now){
  requestAnimationFrame(pvFrame);
  const cv=$('pv');
  if(!cv||armoryEl.hidden||UI.nav!=='battle'){ PV.last=now; return; }
  const dt=Math.min(0.05,(now-(PV.last||now))/1000); PV.last=now; PV.t+=dt;
  const r=cv.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,2), w=Math.max(80,Math.round(r.width)), h=Math.max(80,Math.round(r.height));
  if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){ cv.width=Math.round(w*d); cv.height=Math.round(h*d); }
  const g=cv.getContext('2d'); g.setTransform(d,0,0,d,0,0); g.clearRect(0,0,w,h); g.lineJoin='round';
  const col=UI.elite?C.red:curWorld().color, S=w/300;
  g.strokeStyle='rgba(0,240,255,.07)'; g.lineWidth=1;
  for(let x=0;x<=w;x+=28*S){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }
  for(let y=(PV.t*12*S)%(28*S);y<=h;y+=28*S){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
  const tx=w/2, ty=h-14*S;
  // mobs
  for(const m of PV.mobs){
    m.y+=m.vy*dt; m.rot+=dt*0.8;
    if(m.y>0.86){ Object.assign(m,pvSpawn(m.k)); }
    const def=MOB[m.k], sc=(m.k==='boss'?0.5:m.k==='brute'||m.k==='chunk'?0.8:m.k==='swarm'||m.k==='orb'?1.5:1.1)*S;
    m.px=(m.x+Math.sin(PV.t*0.7+m.ph)*0.03)*w; m.py=m.y*h; m.pr=def.r*sc;
    g.save(); g.translate(m.px,m.py); g.scale(sc,sc);
    shape(g,m.k,def.r,{color:seenK(m.k)?def.color:'#33434d',flash:m.fl>0?1:0,t:PV.t,rot:m.rot,vx:0,vy:1,bs:1,lw:2/sc,col:0});
    g.restore(); if(m.fl>0) m.fl-=dt;
  }
  // turret + bullets
  PV.fire-=dt;
  if(PV.fire<=0){
    PV.fire=0.55+Math.random()*0.5;
    const tg=PV.mobs.filter(m=>m.py>h*0.12).sort((a,b)=>b.py-a.py)[0];
    if(tg){ const dx=tg.px-tx, dy=tg.py-ty, L=Math.hypot(dx,dy)||1; PV.bul.push({x:tx,y:ty-8*S,vx:dx/L*430*S,vy:dy/L*430*S,tg:tg}); }
  }
  g.shadowColor=col; g.shadowBlur=8;
  for(const b of PV.bul){
    b.x+=b.vx*dt; b.y+=b.vy*dt; g.strokeStyle=col; g.lineWidth=2*S; g.beginPath(); g.moveTo(b.x,b.y); g.lineTo(b.x-b.vx*0.03,b.y-b.vy*0.03); g.stroke();
    const t=b.tg; if(t&&Math.hypot(t.px-b.x,t.py-b.y)<t.pr+3){
      b.dead=true; t.hp--; t.fl=0.08;
      for(let i=0;i<6;i++){ const a=Math.random()*6.28; PV.par.push({x:b.x,y:b.y,vx:Math.cos(a)*70*S,vy:Math.sin(a)*70*S,l:0.4,c:MOB[t.k].color}); }
      if(t.hp<=0) Object.assign(t,pvSpawn(t.k));
    }
    if(b.x<-10||b.x>w+10||b.y<-10||b.y>h+10) b.dead=true;
  }
  PV.bul=PV.bul.filter(b=>!b.dead);
  for(const p of PV.par){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.l-=dt; g.globalAlpha=Math.max(0,p.l/0.4); g.fillStyle=p.c; g.fillRect(p.x-1.5,p.y-1.5,3,3); }
  g.globalAlpha=1; PV.par=PV.par.filter(p=>p.l>0);
  g.strokeStyle=col; g.lineWidth=2*S; g.shadowBlur=12; g.beginPath(); g.moveTo(tx,ty-16*S); g.lineTo(tx+11*S,ty+4*S); g.lineTo(tx-11*S,ty+4*S); g.closePath(); g.stroke(); g.shadowBlur=0;
}

function pvPick(e){
  const cv=$('pv'); if(!cv) return null; const r=cv.getBoundingClientRect(); const x=e.clientX-r.left, y=e.clientY-r.top;
  let best=null,bd=1e9; for(const m of PV.mobs){ const d=Math.hypot(m.px-x,m.py-y); if(d<m.pr+14&&d<bd){ bd=d; best=m; } }

}

<script>
/* Freshness check: compare this page's build number to the server's; if they differ, wipe caches + service workers and reload (once). */
(function(){ const BUILD=128; let busy=false, shown=false;
  const inRun=()=>{ try{ return typeof G!=='undefined'&&(G.state==='playing'||G.state==='cards'||G.state==='shop'||G.state==='paused'||G.state==='teach'||G.state==='ctl'); }catch(e){ return false; } };
  function wipeReload(){ let n=0; try{ n=+sessionStorage.getItem('ndReload')||0; sessionStorage.setItem('ndReload',n+1); }catch(e){}
    if(n>=3) return;
    Promise.all([(navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))):0),(window.caches?caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))):0)]).catch(()=>{}).then(()=>location.replace(location.pathname+'?u='+Date.now())); }
  function banner(){ if(shown) return; shown=true; const d=document.createElement('button'); d.type='button'; d.textContent='Update ready. Tap to reload.'; d.style.cssText='position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%);z-index:99999;background:#00f0ff;color:#000;font:700 13px system-ui;border:0;border-radius:999px;padding:9px 16px;box-shadow:0 0 16px #00f0ff'; d.onclick=wipeReload; document.body.appendChild(d); }
  function check(){ if(busy) return; busy=true; try{
    fetch('index.html?v='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{
      busy=false; const m=t.match(/const BUILD=(\d+);/); const live=m?+m[1]:BUILD;
      if(live>BUILD){ if(inRun()) banner(); else wipeReload(); } else { try{ sessionStorage.removeItem('ndReload'); }catch(e){} }
    }).catch(()=>{busy=false;});
  }catch(e){busy=false;} }
  check(); setInterval(()=>{ if(document.visibilityState==='visible') check(); },45000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') check(); }); addEventListener('pageshow',check);
})();
if('serviceWorker' in navigator){ let had=!!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(had) location.reload(); had=true; }); addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{})); }</script>
