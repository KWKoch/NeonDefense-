name: Production release (Play)

# Production repo only. Builds the signed Play bundle for a release that was already tested in KWKoch/NeonDefense-.
# Run by pushing a tag like v1.0.0 (made by tools/promote.sh) or by hand from the Actions tab.
# Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (same upload key as the test repo).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web bundle checks
        run: |
          node build.mjs play
          node tests/achievements.test.mjs
          node tests/music.test.mjs
          node tests/retention.test.mjs
          (cd dist/play && python3 -m http.server 8124 >/dev/null 2>&1 &)
          pip install playwright >/dev/null && python3 -m playwright install --with-deps chromium >/dev/null
          python3 tests/play_browser.py

      - name: Capacitor Android project
        working-directory: play
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          VERSION_CODE=$((10000 + ${{ github.run_number }})) VERSION_NAME=${{ github.ref_name }} node setup-android.mjs   # 10000+ so it always outranks versionCodes uploaded from the test repo
          npx cap sync android

      - name: Signing key (if provided)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the upload key"
          else
            echo "::warning::No signing secrets set: building an UNSIGNED bundle"
          fi

      - name: Build .aab
        working-directory: play/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: neon-defense-production-aab
          path: play/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
