name: Play build (01)

# Builds the Google Play edition: web bundle (node build.mjs play) -> Capacitor Android project -> .aab
# Signing secrets (repo Settings > Secrets and variables > Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the bundle is built unsigned (good for checking the build, not uploadable to Play).
on:
  workflow_dispatch:
  push:
    branches: ['play/**']
    paths: ['index.html', 'build.mjs', 'portal/**', 'play/**', '.github/workflows/play-build.yml']

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web bundle checks
        run: |
          node build.mjs play
          node tests/achievements.test.mjs
          node tests/music.test.mjs
          node tests/retention.test.mjs
          (cd dist/play && python3 -m http.server 8124 >/dev/null 2>&1 &)
          pip install playwright >/dev/null && python3 -m playwright install --with-deps chromium >/dev/null
          python3 tests/play_browser.py

      - name: Capacitor Android project
        working-directory: play
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          VERSION_CODE=${{ github.run_number }} VERSION_NAME=01 node setup-android.mjs
          npx cap sync android

      - name: Signing key (if provided)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the upload key"
          else
            echo "::warning::No signing secrets set: building an UNSIGNED bundle"
          fi

      - name: Build .aab
        working-directory: play/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: neon-defense-play-01-aab
          path: play/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
