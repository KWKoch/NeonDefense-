<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="google-adsense-account" content="ca-pub-4954431316761739">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Neon Defense">

<title>Neon Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: two views. Game = HUD, 3:4 play field, dock (slide pad + tool keys, mode row).
   Armory = credits, level picker, tabbed upgrade cards, bestiary. One committed look: black, neon tubes. */
:root{
  --bg:#000; --fg:#e8f7ff; --dim:#7b93a1; --line:#17313b; --panel:#050a0d;
  --cyan:#00f0ff; --magenta:#ff2bd6; --lime:#b6ff00; --violet:#9d4dff; --orange:#ff8a00; --yellow:#fff200; --red:#ff3860;
  --display:'Monoton',system-ui,sans-serif; --ui:'Chakra Petch',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; box-sizing:border-box; background:var(--bg); color:var(--fg); font-family:var(--ui); font-size:14px;
  padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overscroll-behavior:none; -webkit-user-select:none; user-select:none;
}
#app,#armory{height:100%; max-width:760px; margin:0 auto; min-height:0}
#app{display:flex; flex-direction:column; gap:8px}
button{font-family:inherit}
[hidden]{display:none!important}

#hud{display:grid; grid-template-columns:1fr 1fr 1.1fr 1.5fr; gap:10px; align-items:end}
.stat{display:flex; flex-direction:column; gap:3px; min-width:0}
.lbl{font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim)}
.val{font-size:20px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap}
#credVal{color:var(--yellow); text-shadow:0 0 10px rgba(255,242,0,.45)}
#lvlVal{color:var(--cyan); text-shadow:0 0 10px rgba(0,240,255,.45)}
.bar{height:14px; border:1px solid var(--lime); box-shadow:0 0 8px rgba(182,255,0,.25); padding:1px; box-sizing:border-box}
#hpFill{display:block; height:100%; width:100%; background:var(--lime); box-shadow:0 0 8px var(--lime); transition:width .2s}
.bar.low{border-color:var(--red); box-shadow:0 0 8px rgba(255,56,96,.4)}
.bar.low #hpFill{background:var(--red); box-shadow:0 0 8px var(--red)}

#stage{flex:1 1 0; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden}
#play{position:relative; container-type:size; width:300px; height:400px; box-shadow:0 0 0 1px var(--line),0 0 28px rgba(157,77,255,.12); background:#000}
#c{display:block; width:100%; height:100%; touch-action:none}

@media (max-width:480px){ #hint{display:none} #row1{gap:6px; flex-wrap:wrap; justify-content:space-between} #row1 .seg button{padding-left:10px;padding-right:10px} #row1 .mini{padding-left:7px;padding-right:7px;font-size:11px} }
.pickgrid{display:grid; gap:10px}
.pick{position:relative; display:flex; flex-direction:column; gap:5px; width:100%; text-align:left; background:#000; color:var(--fg); border:1.5px solid var(--c); box-shadow:0 0 12px color-mix(in srgb,var(--c) 40%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 10%,transparent); padding:13px 46px 13px 14px; cursor:pointer; font-family:inherit}
.pick:hover,.pick:focus-visible{background:color-mix(in srgb,var(--c) 12%,#000); outline:none}
.pick:active{transform:scale(.99)}
.pick .pn{font-size:19px; font-weight:700; color:var(--c); letter-spacing:.02em}
.pick .pw{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim)}
.pick .pd{font-size:13px; line-height:1.4}
.pick .pd em{font-style:normal; color:var(--fg)}
.pick .pr{font-size:11px; color:var(--dim)}
.pick .tier{position:absolute; top:10px; right:12px; font-size:10px; font-weight:700; letter-spacing:.18em; color:var(--dim)}
.pick .key{position:absolute; right:12px; bottom:10px; font-size:12px; color:var(--dim); border:1px solid var(--line); width:20px; height:20px; display:flex; align-items:center; justify-content:center}
.pick.t2{border-width:2px} .pick.t2 .tier{color:var(--cyan)}
.pick.t3{border-width:2px; animation:epic 1.8s ease-in-out infinite} .pick.t3 .tier{color:var(--yellow)}
.pick.new .tier{color:var(--lime)}
@keyframes epic{50%{box-shadow:0 0 26px var(--c),inset 0 0 24px color-mix(in srgb,var(--c) 18%,transparent)}}
@media (prefers-reduced-motion:reduce){ .pick.t3{animation:none} }
.perk{display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px solid var(--line); font-size:13px}
.perk span:last-child{color:var(--dim); text-align:right}
#rail{position:absolute; right:6px; top:0; bottom:0; width:44px; z-index:4; pointer-events:none}
#rail .ico{position:absolute; right:0; width:42px; height:42px; border-radius:50%; background:rgba(0,0,0,.78); border:1.5px solid var(--c); color:var(--c); box-shadow:0 0 10px var(--c),inset 0 0 8px rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:0; pointer-events:auto; cursor:pointer; touch-action:manipulation}
#rail .ico svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linejoin:round}
#rail .ico[aria-pressed=true]{background:var(--c); color:#000; box-shadow:0 0 18px var(--c)}
#rail .ico.ready::after{content:''; position:absolute; top:-2px; right:-2px; width:10px; height:10px; border-radius:50%; background:var(--yellow); box-shadow:0 0 8px var(--yellow)}
#rail .ico.lock{opacity:.7}
#orbs{position:absolute; inset:0; z-index:5; pointer-events:none}
.orb{position:absolute; width:50px; height:50px; margin:-25px 0 0 -25px; border-radius:50%; background:rgba(0,0,0,.9); border:1.5px solid var(--c); color:var(--fg); box-shadow:0 0 12px var(--c); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:0; pointer-events:auto; cursor:pointer; font-size:9px; letter-spacing:.06em; font-weight:700; touch-action:manipulation; animation:orbin .22s cubic-bezier(.2,1.4,.4,1) both}
.orb b{font-size:11px; color:var(--yellow); font-variant-numeric:tabular-nums; letter-spacing:0}
.orb i{display:block; font-style:normal; font-size:8px; color:var(--dim); letter-spacing:.04em}
.orb:disabled{opacity:.45; box-shadow:none; cursor:default}
.orb.max{border-style:dashed}
.orb:not(:disabled):active{transform:scale(.92)}
@keyframes orbin{from{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.2)}to{opacity:1; transform:none}}
#orbCap{position:absolute; left:8px; right:60px; bottom:8px; z-index:5; font-size:11px; line-height:1.3; color:var(--fg); background:rgba(0,0,0,.8); border:1px solid var(--line); padding:5px 8px; pointer-events:none}
@media (prefers-reduced-motion:reduce){ .orb{animation:none} }
#banner{position:absolute; left:0; right:0; top:28%; text-align:center; pointer-events:none; opacity:0;
  font-family:var(--display); font-size:clamp(24px,10cqw,54px); line-height:1.1; color:var(--cyan);
  text-shadow:0 0 12px var(--cyan),0 0 34px var(--cyan); padding:0 12px}
#banner small{display:block; margin-top:10px; font-family:var(--ui); font-weight:600; font-size:clamp(11px,3.4cqw,15px); letter-spacing:.24em; text-transform:uppercase; color:var(--fg); text-shadow:none}
#banner.show{animation:ban 2.4s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.25)}12%{opacity:1;transform:scale(1)}72%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #banner.show{animation:banr 2.4s linear forwards}
  @keyframes banr{0%{opacity:0}12%{opacity:1}72%{opacity:1}100%{opacity:0}}
}

#overlay{position:absolute; inset:0; background:rgba(0,0,0,.84); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px; box-sizing:border-box; text-align:center; overflow:auto}
#introov{position:absolute; inset:0; background:rgba(0,0,0,.84); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px; box-sizing:border-box; text-align:center; overflow:auto}
#overlay h1{margin:0; font-family:var(--display); font-weight:400; font-size:clamp(26px,12cqw,58px); line-height:1.05; color:var(--cyan); text-shadow:0 0 10px var(--cyan),0 0 34px var(--magenta); text-wrap:balance}
#introov h1{margin:0; font-family:var(--display); font-weight:400; font-size:clamp(26px,12cqw,58px); line-height:1.05; color:var(--cyan); text-shadow:0 0 10px var(--cyan),0 0 34px var(--magenta); text-wrap:balance}
#overlay .sub{margin:0; max-width:34ch; line-height:1.45}
#introov .sub{margin:0; max-width:34ch; line-height:1.45}
.rows{display:grid; gap:4px; width:min(280px,100%); font-variant-numeric:tabular-nums}
.rows div{display:flex; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); padding:3px 0}
.rows div span:first-child{color:var(--dim)}
.rows .tot{border-bottom:0; color:var(--yellow); font-weight:700; font-size:16px; text-shadow:0 0 10px rgba(255,242,0,.4)}
.obtns{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}

.btn{font:inherit; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--fg); background:rgba(0,0,0,.65);
  border:1px solid var(--c,var(--cyan)); padding:10px 18px; cursor:pointer; box-shadow:0 0 10px color-mix(in srgb,var(--c,var(--cyan)) 35%,transparent)}
.btn:hover:not(:disabled){box-shadow:0 0 18px var(--c,var(--cyan)); background:color-mix(in srgb,var(--c,var(--cyan)) 14%,#000)}
.btn:disabled{opacity:.4; cursor:default; box-shadow:none}
.btn.big{font-size:15px; padding:12px 24px; --c:var(--magenta)}
.btn.sm{padding:8px 12px; font-size:12px}
button:focus-visible{outline:2px solid var(--yellow); outline-offset:2px}

#dock{display:flex; flex-direction:column; gap:8px}
#row0{display:flex; gap:5px; align-items:center; justify-content:center; flex-wrap:wrap}
#row0:not(:has(.tool:not([hidden]))){display:none}
#mflash{position:absolute; inset:0; pointer-events:none; opacity:0; border:3px solid #ffc400; box-shadow:inset 0 0 34px 8px rgba(255,196,0,.75),0 0 18px rgba(255,196,0,.6); z-index:5}
#mflash.go{animation:mfl .6s ease-out}
@keyframes mfl{0%{opacity:1}60%{opacity:.55}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){ #mflash.go{animation-duration:.25s} }


.tool{position:relative; flex:none; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:4px; height:26px; min-width:42px; padding:0 8px; border-radius:999px; color:var(--c); background:#000; border:1px solid color-mix(in srgb,var(--c) 70%,#000); cursor:pointer; overflow:hidden; font:inherit;
  box-shadow:inset 0 0 10px color-mix(in srgb,var(--c) 14%,transparent)}
.tool .ic{position:relative; flex:none; color:var(--c)}
.tool .ts,.tool .tt{position:relative; font-size:12px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; color:var(--fg)}
.tool .tt{color:var(--c); font-weight:600}
.tool .ts:empty,.tool .tt:empty{display:none}
.tool .tp{position:absolute; left:0; top:0; bottom:0; width:0; background:var(--c); opacity:.22}
.tool.passive{cursor:default}
.tool.off{opacity:.45}
.tool.rdy{box-shadow:0 0 10px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 10px color-mix(in srgb,var(--c) 22%,transparent)}
.tool:disabled{opacity:.42; cursor:default}
.tool[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 26%,#000); box-shadow:0 0 14px var(--c)}

#row1{display:flex; align-items:center; gap:6px}
.seg{display:flex}
.seg button{font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); background:#000; border:1px solid var(--line); padding:7px 12px; cursor:pointer}
.seg button + button{border-left:0}
.seg button[aria-pressed="true"]{color:var(--fg); border-color:var(--c); background:color-mix(in srgb,var(--c) 18%,#000); box-shadow:0 0 12px color-mix(in srgb,var(--c) 45%,transparent)}
#mAuto{--c:var(--cyan)} #mManual{--c:var(--magenta)}
#hint{flex:1; min-width:0; font-size:11px; color:var(--dim)}
.mini{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); background:#000; border:1px solid var(--line); padding:7px 7px; cursor:pointer}
.mini:hover{color:var(--fg); border-color:var(--dim)}
.mini.ready{color:var(--yellow); border-color:var(--yellow); box-shadow:0 0 10px rgba(255,242,0,.4); animation:rdy 1.4s ease-in-out infinite}
@keyframes rdy{50%{box-shadow:0 0 18px rgba(255,242,0,.8)}}
@media (prefers-reduced-motion:reduce){ .mini.ready{animation:none} }
#bankVal.bump{animation:bump .35s ease-out}
@keyframes bump{0%{transform:scale(1.5)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){ #bankVal.bump{animation:none} }
#bankVal{display:inline-block; transform-origin:left center; font-size:18px; color:var(--yellow); text-shadow:0 0 10px rgba(255,242,0,.4)}
#shop{position:fixed; inset:0; z-index:20; background:#000; overflow-y:auto; overflow-x:hidden; box-sizing:border-box;
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
#shop .wrap{max-width:760px; margin:0 auto}
#shop .sticky{position:sticky; bottom:0; display:flex; justify-content:center; padding:12px 0 0; background:linear-gradient(to top,#000 60%,transparent)}
@media (max-width:480px){ #hint{display:none} #row1{justify-content:space-between} }

/* armory */
#armory{overflow-y:auto; overflow-x:hidden; -webkit-user-select:none; user-select:none; padding-bottom:24px}
.ahead{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.ahead h1{margin:0; font-family:var(--display); font-weight:400; font-size:clamp(28px,8vw,44px); line-height:1; color:var(--cyan); text-shadow:0 0 10px var(--cyan),0 0 30px var(--magenta)}
.cr{display:flex; flex-direction:column; align-items:flex-end; gap:2px}
.cr b{font-size:26px; line-height:1; color:var(--yellow); font-variant-numeric:tabular-nums; text-shadow:0 0 12px rgba(255,242,0,.4)}
.deploy{border:1px solid var(--magenta); box-shadow:0 0 16px rgba(255,43,214,.18),inset 0 0 22px rgba(255,43,214,.07); padding:12px; display:grid; gap:10px; margin-bottom:14px}
.lvlpick{display:flex; align-items:center; gap:10px}
.lvlpick .n{flex:1; text-align:center; font-family:var(--display); font-size:clamp(26px,9vw,40px); line-height:1.1; color:var(--fg); text-shadow:0 0 12px var(--cyan)}
.lvlpick .n small{display:block; font-family:var(--ui); font-size:10px; letter-spacing:.24em; color:var(--dim); text-shadow:none; margin-top:4px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:11px; font-weight:600; letter-spacing:.06em; padding:3px 7px; border:1px solid color-mix(in srgb,var(--c,var(--dim)) 70%,#000); color:var(--c,var(--fg)); white-space:nowrap}
.chip.boss{--c:var(--red)}
.note{font-size:12px; color:var(--dim); line-height:1.4}
.tabs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px}
.tab{font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; padding:9px 14px; color:var(--dim); background:#000; border:1px solid var(--line); cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg); border-color:var(--c); background:color-mix(in srgb,var(--c) 16%,#000); box-shadow:0 0 12px color-mix(in srgb,var(--c) 40%,transparent)}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px}
.card{min-width:0; display:flex; flex-direction:column; gap:8px; padding:12px; background:var(--panel); border:1px solid color-mix(in srgb,var(--c) 60%,#000); box-shadow:inset 0 0 18px color-mix(in srgb,var(--c) 10%,transparent)}
.ct{display:flex; justify-content:space-between; align-items:center; gap:8px}
.cn{font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--c)}
.cv{font-variant-numeric:tabular-nums; font-size:13px; line-height:1.35}
.cv em{font-style:normal; color:var(--dim)}
.pips{display:flex; gap:3px; flex-wrap:wrap}
.pips i{width:10px; height:5px; background:#16262d}
.pips i.on{background:var(--c); box-shadow:0 0 6px var(--c)}
.card .btn{margin-top:auto; --c:var(--c)}
.mob{display:grid; grid-template-columns:60px 1fr; gap:10px; align-items:center}
.mob canvas{width:60px; height:60px; background:#000; border:1px solid var(--line)}
.res{display:flex; flex-wrap:wrap; gap:4px; margin-top:4px}
.res span{font-size:11px; font-weight:600; padding:2px 6px; border:1px solid color-mix(in srgb,var(--c) 55%,#000); color:var(--c); font-variant-numeric:tabular-nums}
.res span.weak{background:color-mix(in srgb,var(--c) 22%,#000); color:var(--fg)}
.res span.res-low{opacity:.5}
.foot{margin-top:18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.enrg{display:flex; flex-direction:column; align-items:flex-end; gap:3px}
.enrg .row{display:flex; align-items:center; gap:8px}
.epips{display:flex; gap:3px}
.epips i{width:13px; height:20px; background:#16262d; transform:skewX(-14deg)}
.epips i.on{background:var(--yellow); box-shadow:0 0 8px var(--yellow)}
.enrg b{font-size:20px; line-height:1; color:var(--yellow); font-variant-numeric:tabular-nums; text-shadow:0 0 12px rgba(255,242,0,.4)}
.inv{border:1px solid var(--line); background:var(--panel); padding:12px; display:grid; gap:8px; margin-bottom:14px}
.invg{display:grid; gap:6px}
.invr{display:grid; grid-template-columns:72px repeat(4,minmax(0,1fr)); gap:6px; align-items:center}
.invr .it{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--c)}
.gem{font:inherit; display:flex; flex-direction:column; align-items:center; gap:1px; padding:4px 2px; background:#000; border:1px solid color-mix(in srgb,var(--g) 65%,#000); color:var(--g); cursor:default; min-width:0}
.gem b{font-size:16px; line-height:1.1; font-variant-numeric:tabular-nums; color:var(--fg)}
.gem small{font-size:9px; letter-spacing:.08em; text-transform:uppercase}
.gem.zero{opacity:.38}
button.gem.fuse{cursor:pointer; box-shadow:0 0 9px color-mix(in srgb,var(--g) 55%,transparent)}
button.gem.fuse:hover{background:color-mix(in srgb,var(--g) 18%,#000)}
.gem.leg:not(.zero){box-shadow:0 0 10px color-mix(in srgb,var(--g) 50%,transparent)}
.need{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12px}
.need.short{color:var(--dim)}
.rtag{font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:2px 6px; border:1px solid color-mix(in srgb,var(--g) 70%,#000); color:var(--g)}
.drops{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:6px 0 10px}
.dcard{display:flex; flex-direction:column; align-items:center; gap:3px; min-width:54px; padding:7px 9px; color:var(--g); background:#000; border:1px solid var(--g); box-shadow:0 0 12px color-mix(in srgb,var(--g) 45%,transparent)}
.dcard b{font-size:16px; line-height:1; color:var(--fg)}
.dcard .dots{display:flex; gap:3px}
.dcard .dots i{width:5px; height:5px; border-radius:50%; background:var(--g); box-shadow:0 0 5px var(--g)}
.dcard .dots i.o{background:#1c2a30; box-shadow:none}
.dcard{width:68px; height:68px; min-width:0; padding:0; justify-content:center; border-radius:50%; gap:2px}
.pk{position:relative; display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#000; color:var(--fg); border:1.5px solid var(--c); border-radius:999px; padding:9px 16px 9px 9px; cursor:pointer; font-family:inherit; box-shadow:0 0 12px color-mix(in srgb,var(--c) 40%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 10%,transparent)}
.pk:hover,.pk:focus-visible{background:color-mix(in srgb,var(--c) 12%,#000); outline:none}
.pk:active{transform:scale(.99)}
.pk .ci{position:relative; flex:none; width:50px; height:50px; border-radius:50%; border:1.5px solid var(--c); display:flex; align-items:center; justify-content:center; color:var(--c); background:color-mix(in srgb,var(--c) 14%,#000)}

function briefFor(wd,n,elite){
  const p=profileFor(wd,n,elite);
  if(!elite&&wd.id==='belt'&&STORY.belt[n]) return STORY.belt[n];
  if(!elite&&n===1&&WORLD_INTRO[wd.id]) return WORLD_INTRO[wd.id];
  if(isBoss(n)) return n%50===0?'Mega boss. The whole Chorus is behind it.':'Boss level. A Mothership drops in at the final wave.';
  return (BRIEF[p.feat]||'')+(p.mut?' '+MUTS[p.mut].note:'');
}
const PROF={};
/* A level is not just "everything unlocked so far": it gets a roster of a few mobs, a featured one, and sometimes a mutator. */
function profileFor(wd,n,elite){
  wd=wd||WORLDS[0]; const key=wd.id+'|'+n+'|'+(elite?1:0); if(PROF[key]) return PROF[key];
  const uw=wd.uw||UW, NW=waveCount(n), g0=gpOf(n,1), g1=gpOf(n,NW), wi=Math.max(0,WORLDS.indexOf(wd));
  const rng=mulberry(n*3571+(wi+1)*977+(elite?55:0)+13);
  const avail=Object.keys(uw).filter(k=>MOB[k]&&MOB[k].spawn&&uw[k]<=g1);
  const debut=avail.filter(k=>uw[k]>=g0&&uw[k]<=g1&&!(k==='rock'&&n>1));
  const size=Math.max(2,Math.min(5,2+Math.floor(n/10)))+(elite?1:0);
  let roster=debut.slice();
  let rest=avail.filter(k=>roster.indexOf(k)<0);
  if(n>6&&rest.length>2&&rng()<0.65) rest=rest.filter(k=>k!=='rock');
  for(let i=rest.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=rest[i]; rest[i]=rest[j]; rest[j]=t; }
  while(roster.length<size&&rest.length) roster.push(rest.shift());
  if(!roster.length) roster=['rock'];
  const fc=roster.filter(k=>k!=='rock'); const feat=debut[0]||(fc.length?fc[Math.floor(rng()*fc.length)]:roster[0]);
  let mut=null;
  if(!isBoss(n)&&n>=5&&(elite||rng()<0.55)){ const ks=MUTK.filter(k=>n>=10||!MUTRES[k]).filter(k=>n>=14||k!=='hardened'); mut=ks[Math.floor(rng()*ks.length)]; }
  if(mut==='armored'&&roster.some(k=>k==='tender'||k==='regen'||k==='egg')) mut='swift';   /* never stack armor on top of healers */
  const p={roster:roster,feat:feat,mut:mut,debut:debut,name:isBoss(n)?(n%50===0?'Mega boss':'Mothership'):(THEME[feat]||'Skirmish')+(mut?' \u00b7 '+MUTS[mut].name:'')};
  return PROF[key]=p;
}

const Music=(function(){

  const CH=[{r:55,n:[220,261.63,329.63]},{r:43.65,n:[174.61,220,261.63]},{r:65.41,n:[261.63,329.63,392]},{r:49,n:[196,246.94,293.66]}];
  function init(){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    ac=new AC(); master=ac.createGain(); master.gain.value=muted?0:0.85;
    const comp=ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
    master.connect(comp); comp.connect(ac.destination);
    duck=ac.createGain(); duck.connect(master);

    const len=ac.sampleRate; noise=ac.createBuffer(1,len,ac.sampleRate);
    const d=noise.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;

  }
  function env(t,peak,dec,dest,att){
    att=att||0.003; const n=ac.createGain();
    n.gain.setValueAtTime(0.0001,t); n.gain.exponentialRampToValueAtTime(peak,t+att); n.gain.exponentialRampToValueAtTime(0.0001,t+att+dec);

  function nsrc(t,dur){ const s=ac.createBufferSource(); s.buffer=noise; s.start(t,Math.random()*0.5); s.stop(t+dur); return s; }
  function kick(t){
    const o=ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(165,t); o.frequency.exponentialRampToValueAtTime(46,t+0.11);
    o.connect(env(t,0.95,0.38,master)); o.start(t); o.stop(t+0.45);

    const s=nsrc(t,0.3), f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1500; f.Q.value=1.2;
    const e=ac.createGain(); e.gain.setValueAtTime(0.0001,t);
    [0,0.011].forEach(o=>{ e.gain.setValueAtTime(0.55,t+o); e.gain.exponentialRampToValueAtTime(0.06,t+o+0.009); });
    e.gain.setValueAtTime(0.65,t+0.022); e.gain.exponentialRampToValueAtTime(0.001,t+0.2);

  function bass(t,f,dur){
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(1100,t); lp.frequency.exponentialRampToValueAtTime(220,t+dur);
    const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=f;

  }
  function stab(t,notes,dur){
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400; lp.Q.value=4;
    lp.connect(env(t,0.1,dur,duck));

    fr.forEach(f=>{ [-7,7].forEach(c=>{ const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.detune.value=c; o.connect(lp); o.start(t); o.stop(t+dur+0.05); }); });

/* Support weapons (mines, chain lightning) go after mobs the turret is NOT already shooting: not its locked target, not anything in its firing lane. */

function canField(){ return hasTool('field')&&G.fieldCd<=0&&G.fields.length<1+bst('fcount'); }
function placeMine(x,y){

  for(let i=0;i<n;i++){ G.stock--; G.mines.push({x:clamp(x+(i-(n-1)/2)*46,24,W-24),y:clamp(y+(i%2?16:0),200,GROUND-50),t:0,dead:false}); }
  Music.place(false); return true;
}
function placeField(x,y){
  if(!canField()) return false;
  const hw=fieldHW();
  G.fields.push({x:clamp(x,hw*0.4,W-hw*0.4),y:clamp(y,140,GROUND-100),hw:hw,h:22,t:0,dur:ST.fdur(L('fdur'))+2*bst('fdurc'),zapT:0.4,slow:Math.max(0.05,ST.fslow(fslowLv(L('fdps')))*Math.pow(0.85,bst('fchill'))),dps:ST.fdps(L('fdps'))*Math.pow(1.4,bst('field'))});

function blast(x,y,R,dmg,floor){
  for(const e of G.enemies){
    if(e.dead) continue;
    const d=Math.hypot(e.x-x,e.y-y), reach=R+e.r*0.5;
    if(d<=reach) hurt(e,dmg*(1-0.4*d/reach),'b',false,floor);
  }
}
function freeze(e,t){ if(e.dead) return; e.frz=Math.max(e.frz||0,e.type==='boss'?t*0.3:t); }
function detonate(m){
  m.dead=true; const R=mineR(), dmg=ST.mdmg(L('mdmg'))*Math.pow(1.4,bst('mine'));
  G.rings.push({x:m.x,y:m.y,r:10,max:R,life:0.45,t:0,color:C.orange}); G.rings.push({x:m.x,y:m.y,r:6,max:R*0.6,life:0.3,t:0,color:C.amber});
  burst(m.x,m.y,C.orange,26,260); G.shake=Math.min(1,G.shake+0.3); Music.boom(true);
  blast(m.x,m.y,R,dmg);
  if(bst('mfreeze')) for(const e of G.enemies){ if(!e.dead&&Math.hypot(e.x-m.x,e.y-m.y)<R+e.r*0.5) freeze(e,1.6); }
  if(bst('mcluster')) for(let i=0;i<4;i++){ const a=i*1.571+0.785, ox=Math.cos(a)*R*0.9, oy=Math.sin(a)*R*0.9;
    G.delay.push({t:0.16+i*0.05,fn:()=>{ G.rings.push({x:m.x+ox,y:m.y+oy,r:4,max:R*0.55,life:0.3,t:0,color:C.amber}); burst(m.x+ox,m.y+oy,C.amber,8,160); blast(m.x+ox,m.y+oy,R*0.55,dmg*0.5); }}); }
  if(bst('mchain')) for(const mm of G.mines){ if(mm.dead||mm===m) continue; if(Math.hypot(mm.x-m.x,mm.y-m.y)<R*1.8) G.delay.push({t:0.12,fn:()=>{ if(!mm.dead) detonate(mm); }}); }
}
function updateMines(dt){
  if(hasTool('mine')&&G.stock<mineMax()){ G.mineT+=dt; if(G.mineT>=mineRech()){ G.mineT=0; G.stock++; } }
  for(const m of G.mines){
    m.t+=dt; if(m.t<0.6) continue;
    for(const e of G.enemies){
      if(e.dead) continue;
      const rr=MINE_R+10+e.r*0.6; const dx=e.x-m.x, dy=e.y-m.y;
      if(dx*dx+dy*dy<rr*rr){ detonate(m); break; }
    }
  }

}
function updateFields(dt){
  if(G.fieldCd>0) G.fieldCd-=dt;
  for(const f of G.fields){
    f.t+=dt;
    if(bst('fstorm')){ f.zapT-=dt; if(f.zapT<=0){ f.zapT=0.6; const ins=G.enemies.filter(e=>!e.dead&&Math.abs(e.x-f.x)<=f.hw+e.r*0.5&&Math.abs(e.y-f.y)<=f.h+e.r*0.5); if(ins.length){ const t=ins[Math.floor(Math.random()*ins.length)]; hurt(t,f.dps*0.9,'e',false); G.bolts.push({a:[f.x+rnd(-f.hw,f.hw)*0.6,f.y],b:[t.x,t.y],t:0,life:0.25,color:C.violet}); } } }
    for(const e of G.enemies){
      if(e.dead) continue;
      if(Math.abs(e.x-f.x)<=f.hw+e.r*0.5&&Math.abs(e.y-f.y)<=f.h+e.r*0.5){
        const eff=e.type==='boss'?0.5:1;
        e.slow=Math.min(e.slow,1-(1-f.slow)*eff);
        hurt(e,f.dps*dt,'e',true);
        if(bst('fchill')&&e.type!=='boss'){ e.fin=(e.fin||0)+dt; if(e.fin>1.2){ e.fin=0; freeze(e,1.0); } }
        if(bst('fpull')&&e.type!=='boss'){ e.x+=(f.x-e.x)*Math.min(1,dt*1.4); }
      }
    }
  }
  G.fields=G.fields.filter(f=>f.t<f.dur);
}
function autoTools(dt){
  G.autoT-=dt; if(G.autoT>0) return; G.autoT=0.4;
  if(canMine()){
    let best=null,bs=-1e9,bx=0,by=0;
    for(const e of G.enemies){
      if(e.dead||e.y<40||e.y>GROUND-150||!supportOK(e)) continue;
      const ym=clamp(e.y+(e.type==='boss'?70:130),230,GROUND-60);
      if(ym<e.y-10) continue;
      const tt=e.vy>1?(ym-e.y)/e.vy:0, xm=clamp(e.x+(e.vx||0)*tt,30,W-30);
      let near=false; for(const m of G.mines) if(Math.hypot(m.x-xm,m.y-ym)<mineR()*0.8){ near=true; break; }
      if(near) continue;
      const sc=e.y+90*(e.res.b-1)+(e.type==='swarm'?40:0);
      if(e.res.b<0.7&&G.enemies.length>1) continue;
      if(sc>bs){ bs=sc; best=e; bx=xm; by=ym; }
    }
    if(best) placeMine(bx,by);
  }
  if(canField()){
    /* only drop a field where it will actually catch things: aim at where the lead mobs will be, and need a crowd or a heavy in the lane */
    const hw=fieldHW(); let best=null,bs=0;
    for(const e of G.enemies){
      if(e.dead||e.y<110||e.y>GROUND-230||e.type==='orb') continue;
      const fy=Math.min(GROUND-170,e.y+(e.vy||30)*1.1+30), fx=clamp(e.x+(e.vx||0)*1.1,hw*0.4,W-hw*0.4);
      if(G.fields.some(f=>Math.abs(f.x-fx)<hw*0.5&&Math.abs(f.y-fy)<45)) continue;
      let sc=0;
      for(const o of G.enemies){ if(o.dead||o.type==='orb') continue; if(G.fields.some(f=>Math.abs(o.x-f.x)<=f.hw&&Math.abs(o.y-f.y)<=f.h+o.r)) continue; if(Math.abs(o.x-fx)<=hw&&o.y<fy+10&&o.y>fy-150){ sc+=(o.type==='brute'||o.type==='shield'||o.type==='boss'||o.type==='chunk'||o.type==='egg')?3:1; } }
      if(sc>bs){ bs=sc; best={x:fx,y:fy}; }
    }
    if(best&&bs>=3) placeField(best.x,best.y);
  }
}


/* ---- chain lightning (auto, energy) ---- */
function chainStrike(tg){

  hurt(tg,dmg*(bst('cshock')?1.6:1),'e',false); if(bst('cshock')) freeze(tg,0.7);
  for(let h=1;h<=jumps&&fr.length;h++){
    const nx=[];
    for(const nd of fr){
      const cand=G.enemies.filter(e=>!e.dead&&!hit.has(e)&&e.y>-10&&Math.hypot(e.x-nd.x,e.y-nd.y)<160).sort((p,q)=>Math.hypot(p.x-nd.x,p.y-nd.y)-Math.hypot(q.x-nd.x,q.y-nd.y)).slice(0,fork);
      for(const e of cand){ hit.add(e); G.bolts.push({a:[nd.x,nd.y],b:[e.x,e.y],t:0,life:0.3,color:C.yellow}); hurt(e,dmg*Math.pow(0.92,h),'e',false); if(bst('cshock')) freeze(e,0.7); nx.push({e:e,x:e.x,y:e.y}); }
    }
    fr=nx;
  }
}
function drawChainPending(){

  ctx.save(); ctx.globalCompositeOperation='lighter'; neon(C.yellow,14,1.6); ctx.globalAlpha=0.35+0.65*k;
  for(let i=0;i<4+Math.floor(k*6);i++){ const a=Math.random()*6.283, r0=e.r*0.6, r1=e.r+8+Math.random()*(10+k*16); ctx.beginPath(); ctx.moveTo(e.x+Math.cos(a)*r0,e.y+Math.sin(a)*r0); const m=(r0+r1)/2, j=(Math.random()-0.5)*0.7; ctx.lineTo(e.x+Math.cos(a+j)*m,e.y+Math.sin(a+j)*m); ctx.lineTo(e.x+Math.cos(a)*r1,e.y+Math.sin(a)*r1); ctx.stroke(); }
  ctx.shadowBlur=0; ctx.lineWidth=1; ctx.globalAlpha=0.25+0.35*k; let c=0;
  for(const o of G.enemies){ if(o.dead||o===e||c>=2) continue; if(Math.hypot(o.x-e.x,o.y-e.y)<160){ c++; ctx.beginPath(); ctx.moveTo(e.x,e.y); const mx=(e.x+o.x)/2+(Math.random()-0.5)*18, my=(e.y+o.y)/2+(Math.random()-0.5)*18; ctx.lineTo(mx,my); ctx.lineTo(o.x,o.y); ctx.stroke(); } }

  ctx.restore();
}
function updateChain(dt){
  if(!hasTool('chain')) return;
  if(G.cpend){
    const p=G.cpend; if(p.e.dead){ G.cpend=null; }
    else { p.t-=dt; if(p.t<=0){ G.cpend=null; chainStrike(p.e); } }
  } else {
    G.chainT-=dt;
    if(G.chainT<=0){
      /* pick a support target away from the turret's lane, preferring the densest cluster so the arcs have somewhere to jump */
      let tg=null,bs=-1e9;
      for(const e of G.enemies){ if(e.dead||e.y<30||!supportOK(e)) continue; let nb=0; for(const o of G.enemies) if(!o.dead&&o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<160) nb++; const sc=nb*40+e.y*0.15+Math.min(e.hp,60)*0.2; if(sc>bs){ bs=sc; tg=e; } }

      for(const e of G.enemies){ if(e.dead||e.y<0) continue; G.bolts.push({a:[e.x+rnd(-10,10),0],b:[e.x,e.y],t:0,life:0.45,color:C.yellow}); hurt(e,dmg,'e',false); }

/* ---- buzz saw (auto, kinetic, bounces off walls and mobs) ---- */
function updateSaws(dt){
  if(!hasTool('saw')) return;
  G.sawCd-=dt;
  const want=1+bst('scount');
  if(G.saws.length<want&&G.sawCd<=0&&G.enemies.some(e=>!e.dead&&e.y>0)){
    const a=rnd(-0.55,0.55), r=ST.ssz(L('ssz'))*(bst('sbig')?1.6:1), life=ST.slife(L('sspd'))+2*bst('sspeed');
    G.saws.push({x:T.x,y:TURRET_Y-30,vx:Math.sin(a)*430,vy:-Math.cos(a)*430,r:r,life:life,max:life,rot:0});
    G.sawCd=0.56;
  }
  const dmg=ST.sdmg(L('sdmg'))*Math.pow(1.4,bst('spow'))*(bst('sbig')?1.5:1);
  const steps=3, h=dt/steps;
  for(const sw of G.saws){
    sw.life-=dt; sw.rot+=dt*16;
    for(let k=0;k<steps;k++){
      sw.vy+=260*h; sw.x+=sw.vx*h; sw.y+=sw.vy*h;
      if(sw.x<sw.r){ sw.x=sw.r; sw.vx=Math.abs(sw.vx)*0.98; sw.pool=dmg*2; } else if(sw.x>W-sw.r){ sw.x=W-sw.r; sw.vx=-Math.abs(sw.vx)*0.98; sw.pool=dmg*2; }
      if(sw.y<sw.r+6){ sw.y=sw.r+6; sw.vy=Math.abs(sw.vy)*0.98; sw.pool=dmg*2; }
      const fl=GROUND-sw.r-22; if(sw.y>fl){ sw.y=fl; sw.vy=-Math.max(Math.abs(sw.vy)*0.95,420); sw.pool=dmg*2; }
      for(const e of G.enemies){
        if(e.dead||e.y<-e.r) continue;
        const dx=sw.x-e.x, dy=sw.y-e.y, rr=sw.r+e.r*0.85, d2=dx*dx+dy*dy;
        if(d2<rr*rr){
          const ready=G.time-(e.sh||0)>ST.scool(L('scool'));
          const hitFx=()=>{
            if(bst('sfire')){ blast(e.x,e.y,44,dmg*0.5); e.burn=2.5; e.burnDps=dmg*0.8; G.rings.push({x:e.x,y:e.y,r:4,max:38,life:0.22,t:0,color:C.orange}); }
            if(bst('sbleed')){ e.bleed=4; e.bleedDps=Math.min((e.bleedDps||0)+dmg*0.5,dmg*2.5); }
            burst(sw.x,sw.y,C.lime,4,170);
          };
          const need=e.hp/Math.max(0.05,e.res.k);
          if(sw.pool===undefined) sw.pool=dmg*2;
          if(need<=dmg+sw.pool){
            /* overpowered: the blade slices straight through and keeps its momentum for the next target */
            if(ready){ e.sh=G.time; sw.pool=Math.max(0,sw.pool-Math.max(0,need-dmg)); hurt(e,Math.max(dmg,need*1.05),'k',false); hitFx(); float(e.x,e.y-e.r-12,'SLICE',C.lime); }
          } else {
            const d=Math.sqrt(d2)||0.01, nx=dx/d, ny=dy/d;
            sw.x=e.x+nx*rr; sw.y=e.y+ny*rr;
            const vn=sw.vx*nx+sw.vy*ny; if(vn<0){ sw.vx-=1.9*vn*nx; sw.vy-=1.9*vn*ny; }
            if(ready){ e.sh=G.time; hurt(e,dmg,'k',false); hitFx(); }
          }
        }
      }
    }
    const sp=Math.hypot(sw.vx,sw.vy); if(sp<330){ sw.vx*=330/sp; sw.vy*=330/sp; } else if(sp>640){ sw.vx*=640/sp; sw.vy*=640/sp; }
  }

}
/* ---- mortar (manual aim, delayed shell: lead your target) ---- */

function mortR(){ return ST.mortrad(L('mortrad'))*(1+0.15*bst('mortarea'))*(bst('mortbust')?0.6:1); }

function fireMortar(x,y){

function updateMortar(dt){

      G.rings.push({x:sh.tx,y:sh.ty,r:10,max:R,life:0.5,t:0,color:C.amber}); G.rings.push({x:sh.tx,y:sh.ty,r:6,max:R*0.6,life:0.32,t:0,color:C.orange});
      burst(sh.tx,sh.ty,C.amber,40,340); burst(sh.tx,sh.ty,'#ffffff',22,420); burst(sh.tx,sh.ty,C.orange,24,260); G.shake=Math.min(1,G.shake+0.8); G.flashA=0.7; Music.boom(true);

      blast(sh.tx,sh.ty,R,dmg,bst('mortbust')?1:0);
      if(bst('mortclu')) for(let i=0;i<4;i++){ const a=i*1.571+0.4, ox=Math.cos(a)*R*0.95, oy=Math.sin(a)*R*0.95;
        G.delay.push({t:0.18+i*0.06,fn:()=>{ G.rings.push({x:sh.tx+ox,y:sh.ty+oy,r:4,max:R*0.6,life:0.3,t:0,color:C.amber}); burst(sh.tx+ox,sh.ty+oy,C.amber,10,180); blast(sh.tx+ox,sh.ty+oy,R*0.6,dmg*0.6); }}); }

function updateEnemies(dt){
  const forms=new Set();
  for(const e of G.enemies) if(e.form&&!e.dead) forms.add(e.form);
  for(const f of forms){
    let mn=99,mx=-1,sl=1;
    for(const e of G.enemies) if(e.form===f&&!e.dead){ mn=Math.min(mn,e.col); mx=Math.max(mx,e.col); sl=Math.min(sl,e.slow); }
    f.ox+=f.dir*f.vx*dt*sl;
    const l=f.ox+mn*56-18, r=f.ox+mx*56+18;
    if(l<8){ f.dir=1; f.ox+=8-l; f.oy+=26; } else if(r>W-8){ f.dir=-1; f.ox-=r-(W-8); f.oy+=26; }
    f.oy+=7*dt*sl;
  }
  for(const e of G.enemies){
    if(e.dead) continue;
    const d=dt*e.slow;
    e.t+=d; e.flash=Math.max(0,e.flash-dt); e.ft=Math.max(0,e.ft-dt); e.rot+=e.spin*d;
    if(e.type==='invader'){ e.x=e.form.ox+e.col*56; e.y=e.form.oy+e.row*50; e.vx=e.form.dir*e.form.vx; }
    else if(e.type==='dart'){ e.vx=Math.cos(e.t*2.6+e.ph)*110; e.x=clamp(e.x+e.vx*d,e.r,W-e.r); e.y+=e.vy*d; }
    else if(e.type==='swarm'||e.type==='hatch'){ e.vx=Math.cos(e.t*3+e.ph*0.2)*55; e.x=clamp(e.x+e.vx*d,e.r,W-e.r); e.y+=e.vy*d; }
    else if(e.type==='leech'){
      if(!e.latched){ e.vx=Math.sin(e.t*3+e.ph)*60; e.x=clamp(e.x+e.vx*d,e.r,W-e.r); e.y+=e.vy*d; if(e.y>=TURRET_Y-70){ e.latched=true; e.y=TURRET_Y-70; float(e.x,e.y-22,'LATCHED',C.red); } }
      else { e.vx=0; G.hp=Math.max(0,G.hp-e.dmg*0.45*d); G.shake=Math.max(G.shake,0.08); if(G.hp<=0) gameOver(); }
    }
    else if(e.type==='egg'){
      if(e.y<170) e.y+=70*d;
      else {
        e.y+=2.5*d; e.x=clamp(e.x+Math.sin(e.t*0.5+e.ph)*14*d,e.r,W-e.r); e.hc=(e.hc===undefined?1.5:e.hc)-d;
        if(e.hc<=0){ e.hc=Math.max(2.4,4.4-G.n*0.02); let hn=0; for(const o of G.enemies) if(!o.dead&&o.type==='hatch') hn++;
          if(hn<14){ for(let k=0;k<2;k++) spawn('hatch',e.x+(k?14:-14),e.y+e.r,{cr:0}); G.rings.push({x:e.x,y:e.y,r:e.r*0.6,max:e.r*2,life:0.4,t:0,color:e.color}); } }
      }
    }
    else if(e.type==='phantom'){
      e.bt=(e.bt===undefined?1.0+Math.random()*0.8:e.bt)-d; e.y+=e.vy*d; e.x=clamp(e.x+Math.sin(e.t*2+e.ph)*20*d,e.r,W-e.r);
      if(e.bt<=0){ e.bt=2.1; burst(e.x,e.y,e.color,8,140); e.x=rnd(e.r+24,W-e.r-24); burst(e.x,e.y,e.color,8,140); }
    }
    else if(e.type==='tender'){
      e.x+=Math.sin(e.t*1.1+e.ph)*14*d; e.x=clamp(e.x,e.r,W-e.r); e.y+=e.vy*d; e.ht=(e.ht===undefined?0.6:e.ht)-d;
      if(e.ht<=0){ e.ht=1; let any=false; for(const o of G.enemies){ if(o.dead||o===e||o.type==='boss'||o.hp>=o.maxhp) continue; if(Math.hypot(o.x-e.x,o.y-e.y)<125){ o.hp=Math.min(o.maxhp,o.hp+o.maxhp*0.09); any=true; } } if(any) G.rings.push({x:e.x,y:e.y,r:10,max:125,life:0.45,t:0,color:e.color}); }
    }
    else if(e.type==='boss'){
      const amp=W/2-e.r-30; e.x=W/2+Math.sin(e.t*0.6)*amp; e.vx=Math.cos(e.t*0.6)*0.6*amp;
      if(e.y<150) e.y+=e.vy*d*2.5;

function updateBullets(dt){
  for(const b of G.bullets){
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.y<-20||b.x<-20||b.x>W+20){ b.dead=true; continue; }
    for(const e of G.enemies){
      if(e.dead||b.hits.indexOf(e)>=0) continue;
      const dx=e.x-b.x, dy=e.y-b.y, rr=e.r+4;
      if(dx*dx+dy*dy<rr*rr){
        b.hits.push(e); hurt(e,b.dmg,'k',false); b.pierce--;
        if(bst('arc')&&!e.dead) hurt(e,b.dmg*0.35*bst('arc'),'e',true);
        if(bst('frag')){ const fx=e.x, fy=e.y; for(const o of G.enemies){ if(o.dead||o===e) continue; if(Math.hypot(o.x-fx,o.y-fy)<54+o.r*0.4) hurt(o,b.dmg*0.3*bst('frag'),'b',true); } G.rings.push({x:fx,y:fy,r:4,max:42,life:0.22,t:0,color:C.orange}); }

function update(dt){
  G.time+=dt;
  if(G.state!=='playing') return;
  if(G.pickQ>0){ openCards(); return; }
  G.waveT+=dt; if(G.tag) G.tag.t+=dt;
  while(G.events.length&&G.events[0].t<=G.waveT) G.events.shift().fn();
  if(!G.events.length){
    const alive=G.enemies.some(e=>!e.dead)||G.warps.length>0;
    if(G.wave>=G.NW){ if(!alive){ win(); return; } }
    else {
      if(G.nextT===null&&(!alive||G.waveT>G.span)) G.nextT=alive?0.1:1.0;
      if(G.nextT!==null){ G.nextT-=dt; if(G.nextT<=0) startWave(G.wave+1); }
    }
  }
  for(const e of G.enemies){ e.slow=1; if(e.frz>0){ e.frz-=dt; e.slow=0.04; } }
  updateFields(dt); updateMines(dt);
  updateTurret(dt);
  if(G.mode==='auto') autoTools(dt);
  updateChain(dt); updateSaws(dt); updateMortar(dt); updateFires(dt);
  updateWarps(dt); updateEnemies(dt); updateBullets(dt);
  for(const d of G.delay) d.t-=dt; for(const d of G.delay) if(d.t<=0&&!d.done){ d.done=true; d.fn(); } G.delay=G.delay.filter(d=>!d.done);
  for(const b of G.bolts) b.t+=dt; G.bolts=G.bolts.filter(b=>b.t<b.life);
  if(G.chips){ for(const c of G.chips){ c.life-=dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.vx*=0.97; c.vy=c.vy*0.97+40*dt; c.rot+=c.vr*dt; } G.chips=G.chips.filter(c=>c.life>0); }
  for(const p of G.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.985; p.vy*=0.985; p.life-=dt; }
  for(const r of G.rings) r.t+=dt;
  for(const f of G.floats){ f.t+=dt; f.y-=26*dt; }
  G.enemies=G.enemies.filter(e=>!e.dead);
  G.bullets=G.bullets.filter(b=>!b.dead);
  G.parts=G.parts.filter(p=>p.life>0);
  G.rings=G.rings.filter(r=>r.t<r.life);
  G.floats=G.floats.filter(f=>f.t<f.life);
}

/* ---- semi-live level preview: mobs drift, a little turret shoots them ---- */
const PV={mobs:[],bul:[],par:[],t:0,fire:0,last:0};
function pvSpawn(k,f){
  const m=MOB[k], boss=k==='boss';
  return {k:k,x:boss?0.5:0.14+Math.random()*0.72,y:f===undefined?-0.08:f,vy:boss?0.012:(0.035+Math.random()*0.03)*(m.vy>80?1.5:1),rot:Math.random()*6,hp:boss?6:1,ph:Math.random()*6,px:0,py:0,pr:20};

function pvFrame(now){
  requestAnimationFrame(pvFrame);
  const cv=$('pv');
  if(!cv||armoryEl.hidden||UI.nav!=='battle'){ PV.last=now; return; }
  const dt=Math.min(0.05,(now-(PV.last||now))/1000); PV.last=now; PV.t+=dt;
  const r=cv.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,2), w=Math.max(80,Math.round(r.width)), h=Math.max(80,Math.round(r.height));
  if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){ cv.width=Math.round(w*d); cv.height=Math.round(h*d); }
  const g=cv.getContext('2d'); g.setTransform(d,0,0,d,0,0); g.clearRect(0,0,w,h); g.lineJoin='round';
  const col=UI.elite?C.red:curWorld().color, S=w/300;
  g.strokeStyle='rgba(0,240,255,.07)'; g.lineWidth=1;
  for(let x=0;x<=w;x+=28*S){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }
  for(let y=(PV.t*12*S)%(28*S);y<=h;y+=28*S){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
  const tx=w/2, ty=h-14*S;
  // mobs
  for(const m of PV.mobs){
    m.y+=m.vy*dt; m.rot+=dt*0.8;
    if(m.y>0.86){ Object.assign(m,pvSpawn(m.k)); }
    const def=MOB[m.k], sc=(m.k==='boss'?0.5:m.k==='brute'||m.k==='chunk'?0.8:m.k==='swarm'||m.k==='orb'?1.5:1.1)*S;
    m.px=(m.x+Math.sin(PV.t*0.7+m.ph)*0.03)*w; m.py=m.y*h; m.pr=def.r*sc;
    g.save(); g.translate(m.px,m.py); g.scale(sc,sc);
    shape(g,m.k,def.r,{color:P.seen[m.k]?def.color:'#33434d',flash:m.fl>0?1:0,t:PV.t,rot:m.rot,vx:0,vy:1,bs:1,lw:2/sc,col:0});
    g.restore(); if(m.fl>0) m.fl-=dt;
  }
  // turret + bullets
  PV.fire-=dt;
  if(PV.fire<=0){
    PV.fire=0.55+Math.random()*0.5;
    const tg=PV.mobs.filter(m=>m.py>h*0.12).sort((a,b)=>b.py-a.py)[0];
    if(tg){ const dx=tg.px-tx, dy=tg.py-ty, L=Math.hypot(dx,dy)||1; PV.bul.push({x:tx,y:ty-8*S,vx:dx/L*430*S,vy:dy/L*430*S,tg:tg}); }
  }
  g.shadowColor=col; g.shadowBlur=8;
  for(const b of PV.bul){
    b.x+=b.vx*dt; b.y+=b.vy*dt; g.strokeStyle=col; g.lineWidth=2*S; g.beginPath(); g.moveTo(b.x,b.y); g.lineTo(b.x-b.vx*0.03,b.y-b.vy*0.03); g.stroke();
    const t=b.tg; if(t&&Math.hypot(t.px-b.x,t.py-b.y)<t.pr+3){
      b.dead=true; t.hp--; t.fl=0.08;
      for(let i=0;i<6;i++){ const a=Math.random()*6.28; PV.par.push({x:b.x,y:b.y,vx:Math.cos(a)*70*S,vy:Math.sin(a)*70*S,l:0.4,c:MOB[t.k].color}); }
      if(t.hp<=0) Object.assign(t,pvSpawn(t.k));
    }
    if(b.x<-10||b.x>w+10||b.y<-10||b.y>h+10) b.dead=true;
  }
  PV.bul=PV.bul.filter(b=>!b.dead);
  for(const p of PV.par){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.l-=dt; g.globalAlpha=Math.max(0,p.l/0.4); g.fillStyle=p.c; g.fillRect(p.x-1.5,p.y-1.5,3,3); }
  g.globalAlpha=1; PV.par=PV.par.filter(p=>p.l>0);
  g.strokeStyle=col; g.lineWidth=2*S; g.shadowBlur=12; g.beginPath(); g.moveTo(tx,ty-16*S); g.lineTo(tx+11*S,ty+4*S); g.lineTo(tx-11*S,ty+4*S); g.closePath(); g.stroke(); g.shadowBlur=0;
}

function pvPick(e){

function eligible(c){
  if(bst(c.id)>=c.max||!reqOk(c)) return false;
  if(c.cond&&!c.cond()) return false;
  if(c.lv&&wlv(c.w)<c.lv) return false;
  if(c.mst&&mastery(c.w)<c.mst) return false;
  if(c.ex&&c.ex.some(k=>bst(k))) return false;
  if(c.any&&!c.any.some(k=>bst(k))) return false;
  if(c.unlock) return !hasTool(c.w)&&wcount()<4;
  return c.w==='turret'||hasTool(c.w);
}
function offerCards(){
  const bias=(G.wd&&G.wd.bias)||{};
  const early=G.n<=5&&!G.elite;
  const pool=CARDS.filter(eligible).map(c=>({c:c,w:(c.wt||(c.evo||c.ult?9:c.unlock?(wcount()<2?14:7):c.t===1?10:c.t===2?5:4))*(bias[c.w]||1)*(early?(c.w==='turret'?2.4:c.unlock?0.45:1):1)}));
  const out=[];
  while(out.length<3&&pool.length){
    const tot=pool.reduce((a,b)=>a+b.w,0); let r=Math.random()*tot, i=0;
    for(;i<pool.length;i++){ r-=pool[i].w; if(r<=0) break; }
    i=Math.min(i,pool.length-1); out.push(pool[i].c); pool.splice(i,1);
  }
  if(early&&!out.some(c=>c.w==='turret')){ const tp=CARDS.filter(c=>c.w==='turret'&&eligible(c)&&c.id!=='repair'); if(tp.length){ const pick=tp[Math.floor(Math.random()*tp.length)]; if(out.length<3) out.push(pick); else out[out.length-1]=pick; } }
  const big=CARDS.filter(c=>(c.evo||c.ult)&&eligible(c));
  if(big.length&&!out.some(c=>c.evo||c.ult)){ const ult=big.filter(c=>c.ult), pick=(ult.length?ult:big)[Math.floor(Math.random()*(ult.length?ult.length:big.length))]; if(out.length<3) out.push(pick); else out[2]=pick; }
  return out;
}

  btn.addEventListener('click',()=>{ if(btn.disabled) return; clearInterval(iv); ov.remove(); G.state='playing'; toolKey=''; hudKey=''; if(G.teachQ&&G.teachQ.length) openTeach(); });
}
function nextOffer(){ G.offer=offerCards(); if(!G.offer.length){ G.pickQ=0; closeCards(); return; } renderCards(); }
function openCards(){
  if(G.state!=='playing') return;
  G.state='cards'; G.armed=null; G.ghost.show=false; G.placing=false; input.active=false; toolKey=''; hudKey='';
  G.pickQ--; shopEl.hidden=false; nextOffer();
}
function closeCards(){ G.state='playing'; shopEl.hidden=true; toolKey=''; hudKey=''; if(G.teachQ&&G.teachQ.length) openTeach(); }
function pickCard(i){
  if(G.state!=='cards') return;
  const c=G.offer[i]; if(!c) return;
  applyCard(c); Music.up(); if(c.unlock){ P.seenW=P.seenW||{}; if(!P.seenW[c.w]){ P.seenW[c.w]=1; try{ save(); }catch(e){} queueTeach({kind:'weapon',w:c.w}); } }
  if(G.pickQ>0){ G.pickQ--; nextOffer(); } else closeCards();
}
function rerollCards(){ if(G.state!=='cards'||G.rerolls<=0) return; G.rerolls--; G.offer=offerCards(); renderCards(); }
/* perks list (button / U key) */
function renderShop(){
  let h='<div class="wrap"><div class="ahead"><h1>Perks</h1><div class="cr"><span class="lbl">Weapons</span><b>'+wcount()+'/4</b></div></div>'
    +'<div class="note" style="margin-bottom:12px">You start with just the turret. Every other weapon comes from a card, and you can carry up to four.</div>';
  Object.keys(WEAPN).forEach(w=>{
    if(w!=='turret'&&!hasTool(w)) return;
    const own=CARDS.filter(c=>c.w===w&&!c.unlock&&bst(c.id)>0);
    h+='<div class="card" style="--c:'+WEAPN[w].color+';margin-bottom:10px"><div class="ct"><span class="cn">'+WEAPN[w].name+'</span></div>'
      +(own.length?own.map(c=>'<div class="perk"><span>'+c.name+(c.max>1?' '+bst(c.id):'')+'</span><span>'+c.txt(bst(c.id))+'</span></div>').join(''):'<div class="note">No cards yet.</div>')+'</div>';
  });
  h+='<div class="sticky"><button class="btn big" data-sact="close" type="button">Back to battle</button></div></div>';
  shopEl.innerHTML=h;
}
function openShop(){
  if(G.state!=='playing') return;
  G.state='shop'; G.armed=null; G.ghost.show=false; G.placing=false; input.active=false; toolKey=''; hudKey='';
  shopEl.hidden=false; renderShop();
}
function closeShop(){
  if(G.state!=='shop') return;
  G.state='playing'; shopEl.hidden=true; toolKey=''; hudKey='';
}
shopEl.addEventListener('click',e=>{
  const t=e.target.closest('[data-pick],[data-sact]'); if(!t) return;
  if(t.dataset.sact==='close'){ closeShop(); return; }
  if(t.dataset.pick==='re') rerollCards(); else pickCard(+t.dataset.pick);
});
$('shopBtn').addEventListener('click',()=>{ if(G.state==='shop') closeShop(); else openShop(); });

/* ================= input ================= */
function toWorld(e){ const r=canvas.getBoundingClientRect(); return {x:clamp((e.clientX-r.left)/r.width*W,0,W), y:(e.clientY-r.top)/r.height*H}; }
let lp=null, lastTap=null;
function lpClear(){ if(lp){ clearTimeout(lp.t); lp=null; } }
canvas.addEventListener('pointerdown',e=>{
  if(G.state!=='playing') return;
  const p=toWorld(e);
  if(G.armed==='mortar'){ fireMortar(p.x,p.y); if(!canMortar()){ G.armed=null; G.ghost.show=false; } toolKey=''; return; }
  if(G.armed){ G.ghost.x=p.x; G.ghost.y=p.y-(e.pointerType==='mouse'?0:70); G.ghost.show=true; G.placing=true; try{ canvas.setPointerCapture(e.pointerId); }catch(_){} return; }
  if(hasTool('mortar')&&!G.armed){
    const now=performance.now();
    if(lastTap&&now-lastTap.t<340&&Math.hypot(p.x-lastTap.x,p.y-lastTap.y)<80){
      lastTap=null;
      if(canMortar()){ fireMortar(p.x,p.y); G.rings.push({x:p.x,y:p.y,r:6,max:34,life:0.4,t:0,color:C.amber}); toolKey=''; }
    } else lastTap={t:now,x:p.x,y:p.y};
  }
  if(G.mode==='manual'){ input.x=p.x; input.active=true; try{ canvas.setPointerCapture(e.pointerId); }catch(_){} }
});
canvas.addEventListener('pointermove',e=>{
  if(G.state!=='playing') return;
  const p=toWorld(e);
  if(lp&&Math.hypot(p.x-lp.q.x,p.y-lp.q.y)>26) lpClear();
  if(G.armed==='mortar'){ if(e.pointerType==='mouse'){ G.ghost.x=p.x; G.ghost.y=p.y; G.ghost.show=true; } return; }
  if(G.armed){ if(G.placing||e.pointerType==='mouse'){ G.ghost.x=p.x; G.ghost.y=p.y-(e.pointerType==='mouse'?0:70); G.ghost.show=true; } return; }
  if(G.mode==='manual'&&(e.pointerType==='mouse'||input.active)){ input.x=p.x; input.active=true; }
});
canvas.addEventListener('pointerup',e=>{
  lpClear();
  if(G.armed&&G.placing){ commitArmed(); return; }
  if(e.pointerType!=='mouse') input.active=false;
});
canvas.addEventListener('pointercancel',()=>{ lpClear(); input.active=false; G.placing=false; });
canvas.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse'){ input.active=false; if(!G.placing) G.ghost.show=false; } });

toolMine.addEventListener('click',()=>arm('mine'));
toolField.addEventListener('click',()=>arm('field'));

window.addEventListener('keydown',e=>{
  const k=e.key;
  if(G.state==='cards'){ if(k==='1'||k==='2'||k==='3') pickCard(+k-1); else if(k==='r'||k==='R') rerollCards(); return; }
  if(k==='u'||k==='U'){ if(G.state==='playing') openShop(); else if(G.state==='shop') closeShop(); return; }
  if(k==='Escape'&&G.state==='shop'){ closeShop(); return; }
  if(G.state==='playing'){
    if(k==='ArrowLeft'||k==='a'||k==='A'){ keys.left=true; e.preventDefault(); }
    else if(k==='ArrowRight'||k==='d'||k==='D'){ keys.right=true; e.preventDefault(); }
    else if(k==='1') arm('mine'); else if(k==='2') arm('field');
    else if(k==='Escape'&&G.armed){ G.armed=null; G.ghost.show=false; toolKey=''; }
  }
  if(k==='m'||k==='M'){ if(G.state==='playing'||G.state==='paused') setMode(G.mode==='auto'?'manual':'auto'); }
  else if(k==='p'||k==='P'){ togglePause(); }
});
window.addEventListener('keyup',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A') keys.left=false;
  if(k==='ArrowRight'||k==='d'||k==='D') keys.right=false;
});
window.addEventListener('blur',()=>{ keys.left=keys.right=false; });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&G.state==='playing') togglePause(); });
document.addEventListener('pointerdown',()=>Music.start(),{once:true});
$('mAuto').addEventListener('click',()=>setMode('auto'));
$('mManual').addEventListener('click',()=>setMode('manual'));
$('pauseBtn').addEventListener('click',togglePause);
$('spdBtn').addEventListener('click',()=>{ G.speed=G.speed%3+1; $('spdBtn').textContent=G.speed+'x'; });
let muted=false;
$('muteBtn').addEventListener('click',()=>{ muted=!muted; Music.setMuted(muted); $('muteBtn').textContent=muted?'Muted':'Sound'; });

/* ================= sizing and loop ================= */
function fit(){
  const r=stage.getBoundingClientRect(); if(r.width<10||r.height<10) return;
  const s=Math.min(r.width/W,r.height/H);
  const w=Math.max(120,Math.floor(W*s)), h=Math.max(160,Math.floor(H*s)), d=Math.min(window.devicePixelRatio||1,2);
  play.style.width=w+'px'; play.style.height=h+'px';
  canvas.width=Math.round(w*d); canvas.height=Math.round(h*d);
  sx=canvas.width/W; sy=canvas.height/H;
}
if(window.ResizeObserver) new ResizeObserver(fit).observe(stage);
window.addEventListener('resize',fit);

let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now;
  if(!appEl.hidden&&!Ads.busy){
    for(let i=0;i<G.speed;i++) update(dt);
    render(dt); renderHud(); renderTools();
  }
  requestAnimationFrame(frame);
}
P.sel=clamp(P.sel,1,Math.min(P.best+1,LEVELS));
setMode('auto');
renderArmory(); showView('armory'); wantReward(); Ads.loadingDone();
if(!P.intro){ const io=document.createElement('div'); io.id='introov'; io.innerHTML='<h1>Neon Defense</h1>'+STORY.intro.map(t=>'<p class="sub">'+t+'</p>').join('')+'<div class="obtns"><button class="btn big" type="button">Begin</button></div>'; io.addEventListener('click',e=>{ if(e.target.closest('button')){ P.intro=1; save(); io.remove(); } }); document.body.appendChild(io); }
requestAnimationFrame(frame);

/* test hook for headless checks */
window.__rr={chip:chip,openTeach:openTeach,fireMortar:fireMortar,shape:shape,spawn:spawn,G:G,get P(){return P;},set P(v){P=v;},newP:newP,startLevel:startLevel,update:update,UPS:UPS,waveCount:waveCount,levelPool:levelPool,hpScale:hpScale,tune:(a,b,c,d,m,k,bk,wh,pm,lk,c0,cg)=>{if(lk!==undefined)LATEK=lk;if(pm!==undefined)PICKM=pm;if(wh!==undefined)WAVEHP=wh;if(k!==undefined)HPK=k;if(m!==undefined)MOBN=m;if(c0!==undefined)CDROP0=c0;if(cg!==undefined)CDROPG=cg;HPG=a;POOL0=b;POOLG=c;if(d!==undefined)HPA=d;},bst:bst,pickCard:pickCard,CARDS:CARDS,offerCards:offerCards,hasTool:hasTool,fireMortar:fireMortar,canMortar:canMortar,T:T,wcount:wcount,canBuy:canBuy,buyUp:buyUp,cardNeed:cardNeed,bandOf:bandOf,avail:avail,awardCards:awardCards,dropCount:dropCount,fuse:fuse,useEnergy:useEnergy,enTick:enTick,tryStart:tryStart,win:win,gameOver:gameOver,profileFor:profileFor,MOB:MOB,WORLDS:WORLDS,briefFor:briefFor};
})();
</script>

<script type="module" src="cloud.js"></script>
<div id="buildtag" style="position:fixed;right:6px;bottom:2px;font:10px/1 monospace;color:#5a6b75;z-index:5;pointer-events:none">build 26</div>
<script>
/* Freshness check: compare this page's build number to the server's; if they differ, wipe caches + service workers and reload (once). */
(function(){ const BUILD=26; let busy=false, shown=false;
  const inRun=()=>{ try{ return typeof G!=='undefined'&&(G.state==='playing'||G.state==='cards'||G.state==='shop'||G.state==='paused'||G.state==='teach'); }catch(e){ return false; } };
  function wipeReload(){ let n=0; try{ n=+sessionStorage.getItem('ndReload')||0; sessionStorage.setItem('ndReload',n+1); }catch(e){}
    if(n>=3) return;
    Promise.all([(navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))):0),(window.caches?caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))):0)]).catch(()=>{}).then(()=>location.replace(location.pathname+'?u='+Date.now())); }
  function banner(){ if(shown) return; shown=true; const d=document.createElement('button'); d.type='button'; d.textContent='Update ready \u2013 tap to reload'; d.style.cssText='position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:99999;background:#00f0ff;color:#000;font:700 13px system-ui;border:0;border-radius:999px;padding:9px 16px;box-shadow:0 0 16px #00f0ff'; d.onclick=wipeReload; document.body.appendChild(d); }
  function check(){ if(busy) return; busy=true; try{
    fetch('index.html?v='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{
      busy=false; const m=t.match(/const BUILD=(\d+);/); const live=m?+m[1]:BUILD;
      if(live>BUILD){ if(inRun()) banner(); else wipeReload(); } else { try{ sessionStorage.removeItem('ndReload'); }catch(e){} }
    }).catch(()=>{busy=false;});
  }catch(e){busy=false;} }
  check(); setInterval(()=>{ if(document.visibilityState==='visible') check(); },45000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') check(); }); addEventListener('pageshow',check);
})();
if('serviceWorker' in navigator){ let had=!!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(had) location.reload(); had=true; }); addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{})); }</script>
