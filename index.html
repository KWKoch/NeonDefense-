<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="google-adsense-account" content="ca-pub-4954431316761739">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* Layout: two views. Game = HUD, 3:4 play field, dock (slide pad + tool keys, mode row).
   Armory = credits, level picker, tabbed upgrade cards, bestiary. One committed look: black, neon tubes. */
:root{
  --bg:#000; --fg:#e8f7ff; --dim:#7b93a1; --line:#17313b; --panel:#050a0d;
  --cyan:#00f0ff; --magenta:#ff2bd6; --lime:#b6ff00; --violet:#9d4dff; --orange:#ff8a00; --yellow:#fff200; --red:#ff3860;
  --display:'Chakra Petch',system-ui,sans-serif; --logo:'Monoton',system-ui,sans-serif; --ui:'Chakra Petch',system-ui,sans-serif;
  --gemc:#b07cff;   /* gems (premium) are violet everywhere; crystals wear their type colour */
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; box-sizing:border-box; background:var(--bg); color:var(--fg); font-family:var(--ui); font-size:14px;
  padding-top:max(8px,env(safe-area-inset-top,0px)); padding-bottom:max(8px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overscroll-behavior:none; -webkit-user-select:none; user-select:none;
}
#app,#armory{height:100%; max-width:760px; margin:0 auto; min-height:0}
#app{display:flex; flex-direction:column; gap:8px}
button{font-family:inherit}
[hidden]{display:none!important}

#hud{display:grid; grid-template-columns:1fr 1fr 1.1fr 1.5fr; gap:10px; align-items:end}
.stat{display:flex; flex-direction:column; gap:3px; min-width:0}
.lbl{font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim)}
.val{font-size:20px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap}
#credVal{color:var(--yellow); text-shadow:0 0 10px rgba(255,242,0,.45)}
#lvlVal{color:var(--cyan); text-shadow:0 0 10px rgba(0,240,255,.45)}
.bar{height:14px; border:1px solid var(--lime); box-shadow:0 0 8px rgba(182,255,0,.25); padding:1px; box-sizing:border-box}
#shFill{display:block; height:100%; width:100%; background:var(--cyan); box-shadow:0 0 6px var(--cyan); transition:width .15s}
.bar.sh{height:6px; margin-top:3px; padding:0; border-color:var(--cyan); box-shadow:0 0 6px rgba(0,240,255,.3)}
#hpFill{display:block; height:100%; width:100%; background:var(--lime); box-shadow:0 0 8px var(--lime); transition:width .2s}
.bar.low{border-color:var(--red); box-shadow:0 0 8px rgba(255,56,96,.4)}
.bar.low #hpFill{background:var(--red); box-shadow:0 0 8px var(--red)}

#stage{flex:1 1 0; min-height:0; display:flex; align-items:flex-end; justify-content:center; overflow:hidden}
#play{position:relative; container-type:size; width:300px; height:400px; box-shadow:0 0 0 1px var(--line),0 0 28px rgba(157,77,255,.12); background:#000}
#c{display:block; width:100%; height:100%; touch-action:none}
/* glow pass: a quarter-size copy of the field, blurred and screened back over it */
#bloom{position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; mix-blend-mode:screen; filter:blur(5px) contrast(1.5) brightness(.9); opacity:.7}
#bloom.off{display:none}

@media (max-width:480px){ #hint{display:none} #row1{gap:6px; flex-wrap:wrap; justify-content:space-between} #row1 .seg button{padding-left:10px;padding-right:10px} #row1 .mini{padding-left:7px;padding-right:7px;font-size:11px} }
.pickgrid{display:grid; gap:10px}
.pick{position:relative; display:flex; flex-direction:column; gap:5px; width:100%; text-align:left; background:#000; color:var(--fg); border:1.5px solid var(--c); box-shadow:0 0 12px color-mix(in srgb,var(--c) 40%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 10%,transparent); padding:13px 46px 13px 14px; cursor:pointer; font-family:inherit}
.pick:hover,.pick:focus-visible{background:color-mix(in srgb,var(--c) 12%,#000); outline:none}
.pick:active{transform:scale(.99)}
.pick .pn{font-size:19px; font-weight:700; color:var(--c); letter-spacing:.02em}
.pick .pw{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim)}
.pick .pd{font-size:13px; line-height:1.4}
.pick .pd em{font-style:normal; color:var(--fg)}
.pick .pr{font-size:11px; color:var(--dim)}
.pick .tier{position:absolute; top:10px; right:12px; font-size:10px; font-weight:700; letter-spacing:.18em; color:var(--dim)}
.pick .key{position:absolute; right:12px; bottom:10px; font-size:12px; color:var(--dim); border:1px solid var(--line); width:20px; height:20px; display:flex; align-items:center; justify-content:center}
.pick.t2{border-width:2px} .pick.t2 .tier{color:var(--cyan)}
.pick.t3{border-width:2px; animation:epic 1.8s ease-in-out infinite} .pick.t3 .tier{color:var(--yellow)}
.pick.new .tier{color:var(--lime)}
@keyframes epic{50%{box-shadow:0 0 26px var(--c),inset 0 0 24px color-mix(in srgb,var(--c) 18%,transparent)}}
@media (prefers-reduced-motion:reduce){ .pick.t3{animation:none} }
.perk{display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px solid var(--line); font-size:13px}
.perk span:last-child{color:var(--dim); text-align:right}
#rail{position:absolute; right:6px; top:0; bottom:0; width:44px; z-index:4; pointer-events:none}
#rail .ico{position:absolute; right:0; width:42px; height:42px; border-radius:50%; background:rgba(0,0,0,.78); border:1.5px solid var(--c); color:var(--c); box-shadow:0 0 10px var(--c),inset 0 0 8px rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:0; pointer-events:auto; cursor:pointer; touch-action:manipulation}
#rail .ico svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linejoin:round}
#rail .ico[aria-pressed=true]{background:var(--c); color:#000; box-shadow:0 0 18px var(--c)}
#rail .ico.ready::after{content:''; position:absolute; top:-2px; right:-2px; width:10px; height:10px; border-radius:50%; background:var(--yellow); box-shadow:0 0 8px var(--yellow)}
#rail .ico.lock{opacity:.7}
#orbs{position:absolute; inset:0; z-index:5; pointer-events:none}
.orb{position:absolute; width:50px; height:50px; margin:-25px 0 0 -25px; border-radius:50%; background:rgba(0,0,0,.9); border:1.5px solid var(--c); color:var(--fg); box-shadow:0 0 12px var(--c); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:0; pointer-events:auto; cursor:pointer; font-size:9px; letter-spacing:.06em; font-weight:700; touch-action:manipulation; animation:orbin .22s cubic-bezier(.2,1.4,.4,1) both}
.orb b{font-size:11px; color:var(--yellow); font-variant-numeric:tabular-nums; letter-spacing:0}
.orb i{display:block; font-style:normal; font-size:8px; color:var(--dim); letter-spacing:.04em}
.orb:disabled{opacity:.45; box-shadow:none; cursor:default}
.orb.max{border-style:dashed}
.orb:not(:disabled):active{transform:scale(.92)}
@keyframes orbin{from{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.2)}to{opacity:1; transform:none}}
#orbCap{position:absolute; left:8px; right:60px; bottom:8px; z-index:5; font-size:11px; line-height:1.3; color:var(--fg); background:rgba(0,0,0,.8); border:1px solid var(--line); padding:5px 8px; pointer-events:none}
@media (prefers-reduced-motion:reduce){ .orb{animation:none} }
#banner{position:absolute; left:0; right:0; top:28%; text-align:center; pointer-events:none; opacity:0;
  font-family:var(--display); font-size:clamp(24px,10cqw,54px); line-height:1.1; color:var(--cyan);
  text-shadow:0 0 12px var(--cyan),0 0 34px var(--cyan); padding:0 12px}
#banner small{display:block; margin-top:10px; font-family:var(--ui); font-weight:600; font-size:clamp(11px,3.4cqw,15px); letter-spacing:.24em; text-transform:uppercase; color:var(--fg); text-shadow:none}
#banner.show{animation:ban 2.4s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.25)}12%{opacity:1;transform:scale(1)}72%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #banner.show{animation:banr 2.4s linear forwards}
  @keyframes banr{0%{opacity:0}12%{opacity:1}72%{opacity:1}100%{opacity:0}}
}

#overlay{position:absolute; z-index:8; inset:0; background:rgba(0,0,0,.84); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px; box-sizing:border-box; text-align:center; overflow:auto}
#introov{position:absolute; inset:0; background:rgba(0,0,0,.84); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px; box-sizing:border-box; text-align:center; overflow:auto}
#overlay h1{margin:0; font-family:var(--display); font-weight:400; font-size:clamp(26px,12cqw,58px); line-height:1.05; color:var(--cyan); text-shadow:0 0 10px var(--cyan),0 0 34px var(--magenta); text-wrap:balance}
#introov h1{margin:0; font-family:var(--logo); font-weight:400; font-size:clamp(26px,12cqw,58px); line-height:1.05; color:var(--cyan); text-shadow:0 0 10px var(--cyan),0 0 34px var(--magenta); text-wrap:balance}
#overlay .sub{margin:0; max-width:34ch; line-height:1.45}
#introov .sub{margin:0; max-width:34ch; line-height:1.45}
.rows{display:grid; gap:4px; width:min(280px,100%); font-variant-numeric:tabular-nums}
.rows div{display:flex; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); padding:3px 0}
.rows div span:first-child{color:var(--dim)}
.rows .tot{border-bottom:0; color:var(--yellow); font-weight:700; font-size:16px; text-shadow:0 0 10px rgba(255,242,0,.4)}
.card.soon{opacity:.82; border-style:dashed}
.paytwo{display:flex; gap:10px}.paytwo .btn{flex:1; display:flex; align-items:center; justify-content:center; gap:6px}
.paytwo .btn[disabled]{opacity:.5; cursor:default}
.obtns{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; flex:none}
/* win / defeat screens: the rewards scroll, the Home / Next / Retry buttons stay pinned in view */
#overlay .ovb{display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; min-height:0; overflow:auto; overscroll-behavior:contain; padding:2px 0}
#overlay .ovf{display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; flex:none}
#overlay:has(.ovb){overflow:hidden}

.btn{font:inherit; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--fg); background:rgba(0,0,0,.65);
  border:1px solid var(--c,var(--cyan)); padding:10px 18px; cursor:pointer; box-shadow:0 0 10px color-mix(in srgb,var(--c,var(--cyan)) 35%,transparent)}
.btn:hover:not(:disabled){box-shadow:0 0 18px var(--c,var(--cyan)); background:color-mix(in srgb,var(--c,var(--cyan)) 14%,#000)}
.btn:disabled{opacity:.4; cursor:default; box-shadow:none}
.btn.big{font-size:15px; padding:12px 24px; --c:var(--magenta)}
.btn.sm{padding:8px 12px; font-size:12px}
button:focus-visible{outline:2px solid var(--yellow); outline-offset:2px}

#dock{display:flex; flex-direction:column; gap:8px}
/* commander abilities: big round command orbs in the bottom corners of the field, away from the weapon chips in the dock */
#play{position:relative}
#cmdDock{display:flex; justify-content:flex-end; align-items:center; gap:22px; padding:10px 14px 6px 0}
#cmdDock:not(:has(.cmo:not([hidden]))){display:none}
.cmo{--p:360deg; position:relative; pointer-events:auto; width:68px; height:68px; border-radius:50%; padding:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--c); cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  border:0; background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 26%,#0a0d14),#04060a 72%); box-shadow:0 0 0 2px #04060a,0 0 0 4px color-mix(in srgb,var(--c) 45%,#000),0 6px 18px rgba(0,0,0,.7)}
.cmo[hidden]{display:none}
.cmo::before{content:''; position:absolute; inset:-7px; border-radius:50%; padding:4px; background:conic-gradient(var(--c) var(--p),color-mix(in srgb,var(--c) 14%,#000) 0); -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.cmo .ic{width:26px; height:26px; filter:drop-shadow(0 0 5px var(--c))}
.cmo .tt{position:relative; font-size:11px; font-weight:800; letter-spacing:.06em; line-height:1; color:#fff; font-variant-numeric:tabular-nums}
.cmo .tp{display:none}
.cmo:disabled{opacity:.62; cursor:default; filter:saturate(.55)}
.cmo.rdy{animation:cmoR 1.2s ease-in-out infinite}
.cmo.rdy::after{content:''; position:absolute; inset:-12px; border-radius:50%; border:2px dashed var(--c); opacity:.7; animation:cmoS 6s linear infinite}
.cmo:active:not(:disabled){transform:scale(.92)}
#cmdA2{width:56px; height:56px}
#cmdA2 .ic{width:22px; height:22px}
@keyframes cmoR{0%,100%{box-shadow:0 0 0 2px #04060a,0 0 0 4px var(--c),0 0 14px color-mix(in srgb,var(--c) 70%,transparent),0 6px 18px rgba(0,0,0,.7)}50%{box-shadow:0 0 0 2px #04060a,0 0 0 4px var(--c),0 0 30px var(--c),0 6px 18px rgba(0,0,0,.7)}}
@keyframes cmoS{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .cmo.rdy,.cmo.rdy::after{animation:none} }
#row0{display:flex; gap:5px; align-items:center; justify-content:center; flex-wrap:wrap}
#row0:not(:has(.tool:not([hidden]))){display:none}
#mflash{position:absolute; inset:0; pointer-events:none; opacity:0; border:3px solid #ffc400; box-shadow:inset 0 0 34px 8px rgba(255,196,0,.75),0 0 18px rgba(255,196,0,.6); z-index:5}
#mflash.go{animation:mfl .6s ease-out}
@keyframes mfl{0%{opacity:1}60%{opacity:.55}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){ #mflash.go{animation-duration:.25s} }


.tool{position:relative; flex:none; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:4px; height:26px; min-width:42px; padding:0 8px; border-radius:999px; color:var(--c); background:#000; border:1px solid color-mix(in srgb,var(--c) 70%,#000); cursor:pointer; overflow:hidden; font:inherit;
  box-shadow:inset 0 0 10px color-mix(in srgb,var(--c) 14%,transparent)}
.tool .ic{position:relative; flex:none; color:var(--c)}
.tool .ts,.tool .tt{position:relative; font-size:12px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; color:var(--fg)}
.tool .tt{color:var(--c); font-weight:600}
.tool .ts:empty,.tool .tt:empty{display:none}
.tool .tp{position:absolute; left:0; top:0; bottom:0; width:0; background:var(--c); opacity:.22}
.tool.passive{cursor:default}
.tool.off{opacity:.45}
.tool.rdy{box-shadow:0 0 10px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 10px color-mix(in srgb,var(--c) 22%,transparent)}
.tool:disabled{opacity:.42; cursor:default}
.tool{height:32px; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent}

/* big weapon triggers: each weapon has its own silhouette so thumbs find them without looking */
#row0{gap:5px; padding-top:2px}
#row0 .tool{flex-direction:column; flex-wrap:nowrap; gap:1px; height:36px; min-width:35px; padding:3px 3px 2px; border-width:1.5px; background:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,#05070c),#020305 78%)}
#row0 .tool .ic{width:14px; height:14px; flex:none; filter:drop-shadow(0 0 4px var(--c))}
#row0 .tool .ts,#row0 .tool .tt{font-size:9px; line-height:1}
#row0 .tool .ts:not(:empty)+.tt:not(:empty){font-size:8px}
#toolMine{border-radius:10px}
#toolMortar{border-radius:20px 20px 7px 7px}
#toolField{border-radius:7px 7px 20px 20px}
#toolChain{border-radius:3px 14px 3px 14px}
#toolSaw{border-radius:50%; width:36px; min-width:36px; padding:3px 0 2px}
.tool[data-w]{cursor:grab}
.tool.man{border-style:dashed}
.tool.held,.tool.grab{opacity:1}
.tool.held{animation:heldp 1s ease-in-out infinite}
.tool.grab{transform:scale(1.14); background:color-mix(in srgb,var(--c) 30%,#000); box-shadow:0 0 18px var(--c); cursor:grabbing}
@keyframes heldp{0%,100%{box-shadow:0 0 4px var(--c)}50%{box-shadow:0 0 16px var(--c),inset 0 0 8px color-mix(in srgb,var(--c) 40%,transparent)}}
@media (prefers-reduced-motion:reduce){ .tool.held{animation:none; box-shadow:0 0 12px var(--c)} }
/* weapon control panel (settings gear and the in-battle Aim button) */
.ch2{position:relative; margin:12px 0 4px; font-family:var(--display); font-weight:400; font-size:18px; letter-spacing:.04em; color:var(--fg); text-shadow:0 0 10px var(--lime)}
.cnote{position:relative; margin:0 0 8px; font-size:12px; line-height:1.4; color:var(--dim)}
.call{position:relative; display:block; width:100%; padding:9px; border-radius:999px; border:1px solid rgba(160,240,255,.35); background:rgba(0,0,0,.4); color:var(--fg); font-family:inherit; font-weight:700; font-size:13px; cursor:pointer}
.call.on{border-color:var(--lime); background:rgba(182,255,0,.14); box-shadow:0 0 12px rgba(182,255,0,.45)}
.cgrid{position:relative; display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px}
.cw{display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 2px; border-radius:14px; border:1px solid color-mix(in srgb,var(--c) 60%,#000); background:#000; color:var(--c); font-family:inherit; cursor:pointer}
.cw b{font-size:11px; color:var(--fg)}
.cw i{font-style:normal; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--c)}
.cw.man{border-style:dashed; background:color-mix(in srgb,var(--c) 18%,#000); box-shadow:0 0 10px color-mix(in srgb,var(--c) 40%,transparent)}
#ctlov{position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.78); display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box}
#ctlov .cbox{width:min(340px,100%); background:#05070c; border:1px solid var(--cyan); box-shadow:0 0 26px rgba(0,240,255,.4); border-radius:18px; padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; box-sizing:border-box}
#ctlov .ch2{margin-top:2px}
#orb{max-height:calc(100dvh - 90px); overflow-y:auto}
.tool[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 26%,#000); box-shadow:0 0 14px var(--c)}

#row1{display:flex; align-items:center; gap:6px}
.seg{display:flex}
.seg button{font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); background:#000; border:1px solid var(--line); padding:7px 12px; cursor:pointer}
.seg button + button{border-left:0}
.seg button[aria-pressed="true"]{color:var(--fg); border-color:var(--c); background:color-mix(in srgb,var(--c) 18%,#000); box-shadow:0 0 12px color-mix(in srgb,var(--c) 45%,transparent)}

#hint{flex:1; min-width:0; font-size:11px; color:var(--dim)}
.mini{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); background:#000; border:1px solid var(--line); padding:7px 7px; cursor:pointer}
.mini:hover{color:var(--fg); border-color:var(--dim)}
.mini.ready{color:var(--yellow); border-color:var(--yellow); box-shadow:0 0 10px rgba(255,242,0,.4); animation:rdy 1.4s ease-in-out infinite}
@keyframes rdy{50%{box-shadow:0 0 18px rgba(255,242,0,.8)}}
@media (prefers-reduced-motion:reduce){ .mini.ready{animation:none} }
#bankVal.bump{animation:bump .35s ease-out}
@keyframes bump{0%{transform:scale(1.5)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){ #bankVal.bump{animation:none} }
#bankVal{display:inline-block; transform-origin:left center; font-size:18px; color:var(--yellow); text-shadow:0 0 10px rgba(255,242,0,.4)}
#shop{position:fixed; inset:0; z-index:20; background:#000; overflow-y:auto; overflow-x:hidden; box-sizing:border-box;
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
#shop .wrap{max-width:760px; margin:0 auto}
#shop .sticky{position:sticky; bottom:0; display:flex; justify-content:center; padding:12px 0 0; background:linear-gradient(to top,#000 60%,transparent)}
@media (max-width:480px){ #hint{display:none} #row1{justify-content:space-between} }

/* armory */
#armory{overflow-y:auto; overflow-x:hidden; -webkit-user-select:none; user-select:none; padding-bottom:24px}
.ahead{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.ahead h1{margin:0; font-family:var(--display); font-weight:400; font-size:clamp(28px,8vw,44px); line-height:1; color:var(--cyan); text-shadow:0 0 10px var(--cyan),0 0 30px var(--magenta)}
.cr{display:flex; flex-direction:column; align-items:flex-end; gap:2px}
.cr b{font-size:26px; line-height:1; color:var(--yellow); font-variant-numeric:tabular-nums; text-shadow:0 0 12px rgba(255,242,0,.4)}
.deploy{border:1px solid var(--magenta); box-shadow:0 0 16px rgba(255,43,214,.18),inset 0 0 22px rgba(255,43,214,.07); padding:12px; display:grid; gap:10px; margin-bottom:14px}
.lvlpick{display:flex; align-items:center; gap:10px}
.lvlpick .n{flex:1; text-align:center; font-family:var(--display); font-size:clamp(26px,9vw,40px); line-height:1.1; color:var(--fg); text-shadow:0 0 12px var(--cyan)}
.lvlpick .n small{display:block; font-family:var(--ui); font-size:10px; letter-spacing:.24em; color:var(--dim); text-shadow:none; margin-top:4px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:11px; font-weight:600; letter-spacing:.06em; padding:3px 7px; border:1px solid color-mix(in srgb,var(--c,var(--dim)) 70%,#000); color:var(--c,var(--fg)); white-space:nowrap}
.chip.boss{--c:var(--red)}
.note{font-size:12px; color:var(--dim); line-height:1.4}
.loadout{display:flex; flex-direction:column; gap:7px; margin:4px 0 10px; padding:9px 10px; border:1px solid var(--line); border-radius:12px; background:rgba(0,240,255,.04)}
.loadout .lrow{display:flex; flex-wrap:wrap; align-items:center; gap:6px}
.loadout .lbl{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin-right:2px}
.loadout .lbl b{color:var(--fg)}
.lslot{display:inline-flex; align-items:center; gap:6px; padding:5px 10px; font:inherit; font-size:12px; font-weight:700; border-radius:99px; border:1px dashed rgba(255,255,255,.22); color:var(--dim); background:transparent}
.lslot.on{border:1px solid var(--cyan); border-style:solid; color:var(--fg); background:rgba(0,240,255,.1); cursor:pointer}
.lslot i{font-style:normal; opacity:.7}
.loadout .leq{align-self:flex-start}
.loadrow{display:flex; justify-content:center; align-items:center; gap:8px; margin:6px 0 0; padding:7px 12px; font:inherit; font-size:12px; color:var(--dim); background:transparent; border:1px solid var(--line); border-radius:99px}
.loadrow b{color:var(--fg)}
.tabs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px}
.tab{font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; padding:9px 14px; color:var(--dim); background:#000; border:1px solid var(--line); cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg); border-color:var(--c); background:color-mix(in srgb,var(--c) 16%,#000); box-shadow:0 0 12px color-mix(in srgb,var(--c) 40%,transparent)}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px}
.card{min-width:0; display:flex; flex-direction:column; gap:8px; padding:12px; background:var(--panel); border:1px solid color-mix(in srgb,var(--c) 60%,#000); box-shadow:inset 0 0 18px color-mix(in srgb,var(--c) 10%,transparent)}
.ct{display:flex; justify-content:space-between; align-items:center; gap:8px}
.cn{font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--c)}
.cv{font-variant-numeric:tabular-nums; font-size:13px; line-height:1.35}
.cv em{font-style:normal; color:var(--dim)}
.pips{display:flex; gap:3px; flex-wrap:wrap}
.pips i{width:10px; height:5px; background:#16262d}
.pips i.on{background:var(--c); box-shadow:0 0 6px var(--c)}
.card .btn{margin-top:auto; --c:var(--c)}
.mob{display:grid; grid-template-columns:60px 1fr; gap:10px; align-items:center}
.mob canvas{width:60px; height:60px; background:#000; border:1px solid var(--line)}
.res{display:flex; flex-wrap:wrap; gap:4px; margin-top:4px}
.res span{font-size:11px; font-weight:600; padding:2px 6px; border:1px solid color-mix(in srgb,var(--c) 55%,#000); color:var(--c); font-variant-numeric:tabular-nums}
.res span.weak{background:color-mix(in srgb,var(--c) 22%,#000); color:var(--fg)}
.res span.res-low{opacity:.5}
.foot{margin-top:18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.enrg{display:flex; flex-direction:column; align-items:flex-end; gap:3px}
.enrg .row{display:flex; align-items:center; gap:8px}
.epips{display:flex; gap:3px}
.epips i{width:13px; height:20px; background:#16262d; transform:skewX(-14deg)}
.epips i.on{background:var(--yellow); box-shadow:0 0 8px var(--yellow)}
.enrg b{font-size:20px; line-height:1; color:var(--yellow); font-variant-numeric:tabular-nums; text-shadow:0 0 12px rgba(255,242,0,.4)}
.inv{border:1px solid var(--line); background:var(--panel); padding:12px; display:grid; gap:8px; margin-bottom:14px}
.invg{display:grid; gap:6px}
.invr{display:grid; grid-template-columns:72px repeat(4,minmax(0,1fr)); gap:6px; align-items:center}
.invr .it{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--c)}
.gem{font:inherit; display:flex; flex-direction:column; align-items:center; gap:1px; padding:4px 2px; background:#000; border:1px solid color-mix(in srgb,var(--g) 65%,#000); color:var(--g); cursor:default; min-width:0}
.gem b{font-size:16px; line-height:1.1; font-variant-numeric:tabular-nums; color:var(--fg)}
.gem small{font-size:9px; letter-spacing:.08em; text-transform:uppercase}
.gem.zero{opacity:.38}
button.gem.fuse{cursor:pointer; box-shadow:0 0 9px color-mix(in srgb,var(--g) 55%,transparent)}
button.gem.fuse:hover{background:color-mix(in srgb,var(--g) 18%,#000)}
.gem.leg:not(.zero){box-shadow:0 0 10px color-mix(in srgb,var(--g) 50%,transparent)}
.need{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12px}
.need.short{color:var(--dim)}
.rtag{font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:2px 6px; border:1px solid color-mix(in srgb,var(--g) 70%,#000); color:var(--g)}
.drops{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:6px 0 10px}
.dcard{display:flex; flex-direction:column; align-items:center; gap:3px; min-width:54px; padding:7px 9px; color:var(--g); background:#000; border:1px solid var(--g); box-shadow:0 0 12px color-mix(in srgb,var(--g) 45%,transparent)}
.dcard b{font-size:16px; line-height:1; color:var(--fg)}
.dcard .dots{display:flex; gap:3px}
.dcard .dots i{width:5px; height:5px; border-radius:50%; background:var(--g); box-shadow:0 0 5px var(--g)}
.dcard .dots i.o{background:#1c2a30; box-shadow:none}
.dcard{width:68px; height:68px; min-width:0; padding:0; justify-content:center; border-radius:50%; gap:2px}
.pk{position:relative; display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#000; color:var(--fg); border:1.5px solid var(--c); border-radius:999px; padding:9px 16px 9px 9px; cursor:pointer; font-family:inherit; box-shadow:0 0 12px color-mix(in srgb,var(--c) 40%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 10%,transparent)}
.pk:hover,.pk:focus-visible{background:color-mix(in srgb,var(--c) 12%,#000); outline:none}
.pk:active{transform:scale(.99)}
.pk .ci{position:relative; flex:none; width:50px; height:50px; border-radius:50%; border:1.5px solid var(--c); display:flex; align-items:center; justify-content:center; color:var(--c); background:color-mix(in srgb,var(--c) 14%,#000)}
.pk .ci2{position:absolute; right:-5px; bottom:-5px; width:22px; height:22px; border-radius:50%; background:#000; border:1px solid var(--tc); color:var(--tc); display:flex; align-items:center; justify-content:center}
.pk .tx{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.pk .pn{font-size:15px; font-weight:700; color:var(--c); line-height:1.15}
.pk .pd{font-size:12px; color:var(--dim); line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.pk .side{flex:none; display:flex; flex-direction:column; align-items:center; gap:5px}
.pk .dots{display:flex; gap:3px}
.pk .dots i{width:6px; height:6px; border-radius:50%; background:var(--g); box-shadow:0 0 5px var(--g)}
.pk .dots i.o{background:#1c2a30; box-shadow:none}
.pk .key{font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center}
.pk .nw{font-size:9px; font-weight:700; letter-spacing:.12em; color:var(--lime)}
.pk.t3{animation:epic 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){ .pk.t3{animation:none} }
.stat1{display:flex; gap:14px; justify-content:center; align-items:center; font-size:14px; font-weight:700; color:var(--fg); margin:4px 0}
.stat1 span{display:inline-flex; align-items:center; gap:5px}
body.menu{background:radial-gradient(140% 55% at 50% -5%,rgba(255,43,214,.22),rgba(157,77,255,.10) 42%,transparent 72%),repeating-linear-gradient(0deg,transparent 0 39px,rgba(0,240,255,.055) 39px 40px),#000; background-attachment:fixed}
.btn,.mini,.seg button{border-radius:999px}
.seg button:first-child{border-radius:999px 0 0 999px}
.seg button:last-child{border-radius:0 999px 999px 0}
.ahead{padding-bottom:10px; border-bottom:1px solid rgba(0,240,255,.18)}
.deploy{border-radius:26px}
.lvlpick .btn.sm{width:44px; height:44px; padding:0; border-radius:50%; font-size:24px; line-height:1}
.btn.big{background:linear-gradient(90deg,rgba(255,43,214,.30),rgba(157,77,255,.30))}
.tab{border-radius:999px; display:inline-flex; align-items:center; gap:6px; padding:8px 13px}
.tab .ic{flex:none}
.card{border-radius:18px}
/* commander market: a wall of thumbnails; tapping one opens that commander */
.cmflt{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0}
.cmflt .chip.cf{cursor:pointer; font:inherit; font-size:11px; opacity:.7; background:#000}
.cmflt .chip.cf.on{opacity:1; box-shadow:0 0 10px var(--c); background:color-mix(in srgb,var(--c) 22%,#000)}
.cmgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
@media (min-width:560px){ .cmgrid{grid-template-columns:repeat(4,1fr)} }
.cmtile{position:relative; display:flex; flex-direction:column; align-items:center; gap:1px; padding:6px 4px 8px; border-radius:14px; cursor:pointer; font:inherit; color:var(--fg); min-width:0;
  background:radial-gradient(ellipse at 50% 70%,color-mix(in srgb,var(--c) 16%,#070a10),#04060a 75%); border:1.5px solid color-mix(in srgb,var(--rc) 70%,#000); box-shadow:0 0 10px color-mix(in srgb,var(--rc) 22%,transparent); -webkit-tap-highlight-color:transparent}
.cmtile.lk canvas.tprev{filter:saturate(.45) brightness(.72)}
.cmtile.eq{box-shadow:0 0 0 1px var(--rc),0 0 16px color-mix(in srgb,var(--rc) 60%,transparent)}
.cmtile canvas.tprev,.cmtile canvas.tprev.dim{width:100%; height:auto; aspect-ratio:240/170; border:0; background:none; border-radius:10px}
.cmtile .tn{font-size:11px; font-weight:800; letter-spacing:.03em; color:var(--c); text-align:center; line-height:1.15; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cmtile .tr{font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim)}
.cmtile .ts2{font-size:10px; font-weight:700; margin-top:2px}
.cmtile:active{transform:scale(.97)}
canvas.tprev.big{width:100%; height:auto; aspect-ratio:440/260; max-width:none}
.cmbtns{display:flex; gap:6px; flex-wrap:wrap}
.cmmodal{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:14px; box-sizing:border-box}
.cmbk{position:absolute; inset:0; background:rgba(0,0,0,.82)}
.cmpanel{position:relative; width:min(460px,100%); max-height:calc(100dvh - 28px); overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:10px; padding:14px; box-sizing:border-box; background:#05070c; border:1px solid var(--c); border-radius:20px; box-shadow:0 0 30px color-mix(in srgb,var(--c) 45%,transparent)}
.cmhead{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; position:sticky; top:-14px; margin:-14px -14px 0; padding:14px; background:#05070c; z-index:1; border-bottom:1px solid color-mix(in srgb,var(--c) 40%,#000)}
.cmhead .btn{flex:none; white-space:nowrap; letter-spacing:.08em}
.cmhead .cn{font-size:18px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--c)}
canvas.tprev{align-self:center; width:220px; height:130px; max-width:100%; border-radius:14px; background:radial-gradient(ellipse at 50% 85%,color-mix(in srgb,var(--c) 22%,#05070c),#04060b 70%); border:1px solid color-mix(in srgb,var(--c) 30%,#000)}
canvas.tprev.dim{filter:saturate(.35) brightness(.7)}
.chip,.rtag{border-radius:999px}
.inv{border-radius:22px}
.gem{border-radius:50%; width:100%; max-width:48px; aspect-ratio:1; justify-self:center; justify-content:center}
.gem b{font-size:15px} .gem small{font-size:8px}
.invr .it{display:flex; align-items:center; gap:5px}
.mobs{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.mb{width:46px; height:46px; border-radius:50%; border:1.5px solid var(--c); background:#000; box-shadow:0 0 10px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 12px color-mix(in srgb,var(--c) 14%,transparent); display:flex; align-items:center; justify-content:center; cursor:help; -webkit-touch-callout:none; touch-action:manipulation}
.mb canvas{width:38px; height:38px; pointer-events:none}
#tip{position:fixed; z-index:50; width:224px; padding:10px 12px; background:#050a0d; border:1px solid var(--cyan); border-radius:14px; box-shadow:0 0 18px rgba(0,240,255,.35); pointer-events:none; display:flex; flex-direction:column; gap:5px; font-size:12px; line-height:1.35}
#tip b{font-size:14px; letter-spacing:.06em; text-transform:uppercase}
#tip span{color:var(--dim)}
#tip .rs{display:flex; gap:5px; flex-wrap:wrap}
#armory{display:flex; flex-direction:column; overflow:hidden; padding:0}
.topbar{display:flex; align-items:center; gap:8px; padding:4px 0 10px; flex:none}
.wchip{display:inline-flex; align-items:center; gap:8px; min-width:0; max-width:46%; padding:5px 12px 5px 6px; border-radius:999px; border:1px solid var(--wc); color:var(--fg); background:#000; font-size:13px; font-weight:700; letter-spacing:.04em; cursor:pointer; box-shadow:0 0 10px color-mix(in srgb,var(--wc) 40%,transparent)}
.wchip .dot{flex:none; width:24px; height:24px; border-radius:50%; border:1.5px solid var(--wc); display:flex; align-items:center; justify-content:center; color:var(--wc)}
.wchip .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sp{flex:1}
.pill{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:#04101a; border:1px solid rgba(0,240,255,.35); font-weight:700; font-size:14px; font-variant-numeric:tabular-nums; box-shadow:inset 0 0 12px rgba(0,240,255,.10); color:var(--fg)}
.pill small{font-size:10px; color:var(--dim); font-weight:600}
#enBox{color:var(--yellow); border-color:rgba(255,242,0,.45)}
.content{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding-bottom:10px; scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.nav{flex:none; display:flex; gap:6px; padding:8px 0 2px; border-top:1px solid rgba(0,240,255,.18); margin-top:6px}
.nav button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 6px; background:transparent; border:1px solid transparent; border-radius:16px; color:var(--dim); font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; cursor:pointer}
.nav button[aria-current="page"]{color:var(--fg); border-color:var(--cyan); background:rgba(0,240,255,.10); box-shadow:0 0 14px rgba(0,240,255,.35)}
.bt{min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:4px 0}
.ttl{text-align:center}
.ttl h1{margin:0; font-family:var(--display); font-weight:400; font-size:clamp(30px,10vw,46px); line-height:1; color:var(--fg); text-shadow:0 0 14px var(--wc)}
.ttl .wsub{display:block; font-size:11px; letter-spacing:.24em; text-transform:uppercase; margin-top:6px; color:var(--wc)}
.mseg{display:flex}
.mseg button{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); background:#000; border:1px solid var(--line); padding:8px 22px; cursor:pointer}
.mseg button:first-child{border-radius:999px 0 0 999px} .mseg button:last-child{border-radius:0 999px 999px 0; border-left:0}
.mseg button[aria-pressed="true"]{color:var(--fg); border-color:var(--c); background:color-mix(in srgb,var(--c) 20%,#000); box-shadow:0 0 14px color-mix(in srgb,var(--c) 50%,transparent)}
.pvrow{width:100%; display:flex; align-items:center; gap:4px}
.chev{flex:none; width:32px; height:72px; background:transparent; border:0; color:var(--cyan); cursor:pointer; display:flex; align-items:center; justify-content:center}
.chev:disabled{opacity:.22; cursor:default}
.chev.r svg{transform:scaleX(-1)}
.pvwrap{position:relative; flex:1; min-width:0; aspect-ratio:1/1.02; max-height:46vh; margin:0 auto; border-radius:24px; border:1.5px solid var(--wc); overflow:hidden; background:radial-gradient(90% 70% at 50% 100%,color-mix(in srgb,var(--wc) 22%,#02060d),#02060d); box-shadow:0 0 24px color-mix(in srgb,var(--wc) 40%,transparent),inset 0 0 34px color-mix(in srgb,var(--wc) 16%,transparent)}
#pv{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:manipulation; -webkit-touch-callout:none}
.pvlock{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; background:rgba(0,0,0,.74); color:var(--fg); text-align:center; padding:18px; font-size:13px; line-height:1.4}
.pvlock .ic{color:var(--yellow)}
.pvtag{position:absolute; left:12px; top:10px; font-size:10px; font-weight:700; letter-spacing:.2em; color:var(--red); text-shadow:0 0 8px var(--red)}
.pvstar{position:absolute; right:12px; top:8px; color:var(--yellow)}
.facts{display:flex; gap:18px; justify-content:center; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums}
.facts span{display:inline-flex; align-items:center; gap:6px}
#armory .pvwrap .btn.go.pvgo{position:absolute; left:50%; right:auto; top:auto; bottom:58px; margin:0; transform:translateX(-50%); z-index:3; width:min(78%,300px)!important; box-shadow:0 0 24px rgba(255,43,214,.55),0 6px 18px rgba(0,0,0,.6)}
#armory .pvwrap .btn.go.pvgo{background:rgba(255,255,255,.02); background-image:none; border:1.5px solid rgba(255,255,255,.55); box-shadow:none; color:#fff; text-shadow:0 0 8px rgba(0,0,0,.85); backdrop-filter:none; -webkit-backdrop-filter:none}
#armory .pvwrap .btn.go.pvgo::before,#armory .pvwrap .btn.go.pvgo::after{display:none}
#armory .pvwrap .btn.go.pvgo:active{background:rgba(255,255,255,.14)}
#armory .pvwrap .btn.go.pvgo:disabled{opacity:.55}
#pv{cursor:pointer}
.btn.go{width:min(84%,340px); display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 20px; font-size:20px; letter-spacing:.12em}
.wlist{display:grid; gap:12px}
.wcard{border:1.5px solid var(--wc); border-radius:22px; padding:12px 14px; display:grid; gap:10px; background:linear-gradient(135deg,color-mix(in srgb,var(--wc) 12%,#02060d),#02060d); box-shadow:0 0 16px color-mix(in srgb,var(--wc) 25%,transparent)}
.wcard.on{box-shadow:0 0 22px color-mix(in srgb,var(--wc) 55%,transparent)}
.wh{display:flex; align-items:center; gap:12px}
.wi{flex:none; width:40px; height:40px; border-radius:50%; border:1.5px solid var(--wc); color:var(--wc); display:flex; align-items:center; justify-content:center}
.wt{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.wt b{font-size:16px; letter-spacing:.06em; text-transform:uppercase; color:var(--wc)}
.wt span{font-size:12px; color:var(--dim); line-height:1.3}
.wlock{flex:none; color:var(--yellow)}
.wm{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.wm canvas{width:34px; height:34px; border-radius:50%; border:1px solid color-mix(in srgb,var(--wc) 60%,#000); background:#000}
.wm .bw{display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:700; color:var(--wc); padding:3px 8px; border:1px solid color-mix(in srgb,var(--wc) 55%,#000); border-radius:999px}
.wm .pr{margin-left:auto; font-weight:700; font-size:13px; font-variant-numeric:tabular-nums; color:var(--fg)}
.wa{display:flex; justify-content:flex-end}
.wa .act{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--wc)}

#armory .pvwrap{border:0; border-radius:28px; padding:0;
  box-shadow:0 0 0 2px #0b141c,0 0 0 3px color-mix(in srgb,var(--wc) 80%,#fff),0 0 0 7px #05090e,0 0 0 8px color-mix(in srgb,var(--wc) 35%,#000),inset 0 0 40px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.08),0 18px 30px -8px rgba(0,0,0,.85),0 0 34px -2px color-mix(in srgb,var(--wc) 50%,transparent)}
#armory .pvwrap::after{content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:linear-gradient(160deg,rgba(255,255,255,.10) 0%,transparent 28%),radial-gradient(120% 90% at 50% 120%,rgba(0,0,0,.45),transparent 60%)}

/* headers */

  box-shadow:inset 0 2px 3px rgba(255,255,255,.4),inset 0 -5px 8px rgba(0,0,0,.65),0 4px 8px rgba(0,0,0,.7),0 0 12px color-mix(in srgb,var(--g,#b8c4cc) 35%,transparent)}
/* shop pack buttons */

  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.45),0 3px 0 color-mix(in srgb,var(--g) 25%,#000),0 6px 10px -2px rgba(0,0,0,.7); transition:transform .08s,box-shadow .08s}

.spbar{height:8px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden}

#armory .nav{margin:8px 2px 4px; padding:7px; gap:4px; border:1px solid rgba(140,225,255,.28); border-radius:26px; background:linear-gradient(180deg,rgba(18,34,48,.88),rgba(4,9,15,.94)); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -2px 6px rgba(0,0,0,.6),0 12px 24px -6px rgba(0,0,0,.85),0 0 20px -6px rgba(0,240,255,.35)}

/* ===== settings orbital: gear button in the menu top bar opens a glass panel with an orbit ring and two "planets" (music, effects) ===== */
.gear{flex:none; width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; padding:0; border-radius:50%; color:var(--fg); cursor:pointer; background:linear-gradient(180deg,#0d2230 0%,#050f18 100%); border:1px solid rgba(120,220,255,.38); box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 4px rgba(0,0,0,.55),0 3px 8px rgba(0,0,0,.6),0 0 10px rgba(0,240,255,.12); transition:transform .15s,box-shadow .15s}
.gear:active{transform:scale(.92)}
.gear[aria-expanded="true"]{border-color:rgba(160,240,255,.85); box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 16px rgba(0,240,255,.55)}
.gear[aria-expanded="true"] .ic{animation:gspin 1.2s linear infinite; filter:drop-shadow(0 0 5px #00f0ff)}
@keyframes gspin{to{transform:rotate(360deg)}}
#orbScrim{position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.35)}
#orb{position:fixed; z-index:91; width:min(310px,calc(100vw - 20px)); box-sizing:border-box; padding:16px 16px 14px; border-radius:30px; color:var(--fg);
  background:radial-gradient(120% 90% at 100% 0%,rgba(157,77,255,.28),transparent 60%),linear-gradient(180deg,rgba(18,34,48,.96),rgba(4,9,15,.98));
  border:1px solid rgba(140,225,255,.4); box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 18px 40px -8px rgba(0,0,0,.9),0 0 28px -4px rgba(0,240,255,.45);
  transform-origin:var(--ox,90%) 0; animation:orbIn .26s cubic-bezier(.2,1.1,.3,1) both}
#orb::before{content:''; position:absolute; right:-70px; top:-70px; width:190px; height:190px; border-radius:50%; border:1px dashed rgba(0,240,255,.35); animation:gspin 22s linear infinite; pointer-events:none}
#orb::after{content:''; position:absolute; right:-24px; top:-24px; width:100px; height:100px; border-radius:50%; border:1px solid rgba(255,43,214,.3); animation:gspin 14s linear infinite reverse; pointer-events:none}
@keyframes orbIn{from{opacity:0; transform:scale(.2)}to{opacity:1; transform:scale(1)}}
#orb h2{position:relative; margin:0 0 12px; font-family:var(--display); font-weight:400; font-size:20px; letter-spacing:.04em; color:var(--fg); text-shadow:0 0 10px var(--cyan)}
.orow{position:relative; display:flex; align-items:center; gap:12px; padding:9px 0}
.orow+.orow{border-top:1px solid rgba(0,240,255,.14)}
.planet{position:relative; flex:none; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer; color:var(--c); border:1.5px solid var(--c);
  background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--c) 45%,#fff) 0,color-mix(in srgb,var(--c) 18%,#000) 55%,#000 100%); box-shadow:inset 0 1px 2px rgba(255,255,255,.35),0 0 14px color-mix(in srgb,var(--c) 55%,transparent); transition:filter .15s,box-shadow .15s,transform .1s}
.planet:active{transform:scale(.93)}
.planet .ic{width:22px; height:22px; color:#fff; filter:drop-shadow(0 0 4px #000)}
.planet[aria-pressed="false"]{filter:grayscale(1) brightness(.55); box-shadow:none; border-color:#33434d}
.planet[aria-pressed="false"]::after{content:''; position:absolute; width:2px; height:34px; background:#ff3860; transform:rotate(45deg); box-shadow:0 0 6px #ff3860; border-radius:2px}
.omid{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px}
.omid .ol{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase}
.omid .ol b{font-weight:700; color:var(--fg)} .omid .ol span{color:var(--dim); font-variant-numeric:tabular-nums; letter-spacing:.04em}
.orow.off .omid{opacity:.5}
#orb input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:26px; margin:0; background:transparent; cursor:pointer; touch-action:pan-y}
#orb input[type=range]::-webkit-slider-runnable-track{height:6px; border-radius:6px; background:linear-gradient(90deg,var(--c) var(--p,100%),#14262f var(--p,100%)); box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
#orb input[type=range]::-moz-range-track{height:6px; border-radius:6px; background:#14262f}

#orb input[type=range]::-moz-range-thumb{width:20px; height:20px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff,var(--c) 70%); border:1px solid rgba(255,255,255,.6); box-shadow:0 0 10px var(--c)}
#orb input[type=range]:focus-visible{outline:2px solid var(--c); outline-offset:3px; border-radius:6px}
#orb .odone{position:relative; display:block; width:100%; margin-top:8px; padding:10px 0; border-radius:999px; border:1px solid rgba(160,240,255,.6); background:linear-gradient(180deg,rgba(0,240,255,.28),rgba(0,120,160,.14)); color:#fff; font:700 13px var(--ui); letter-spacing:.14em; text-transform:uppercase; cursor:pointer}
@media (prefers-reduced-motion:reduce){ #orb,#orb::before,#orb::after,.gear[aria-expanded="true"] .ic{animation:none} }

/* ===== card packs ===== */

<div id="gate" role="dialog" aria-modal="true" aria-label="Sign in"><canvas id="gateFx" aria-hidden="true"></canvas><h1>Neon Defense</h1><p class="gmsg" id="gateMsg">Loading…</p><div class="gbtns" id="gateBtns"></div><p class="gmsg gerr" id="gateErr"></p><p class="gmsg"><a href="https://kwkoch.github.io/privacy.html" target="_blank" rel="noopener" style="color:var(--cyan)">Privacy Policy</a></p></div>

<script>
/* title screen backdrop: a neon horizon grid, drifting stars and raider shapes that a turret picks off. Runs only while the sign-in screen shows. */
(function(){
  var gate=document.getElementById('gate'), cv=document.getElementById('gateFx'); if(!gate||!cv||!cv.getContext) return;
  var g=cv.getContext('2d'), W=0, H=0, D=1, raf=0, t0=0, last=0, still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var COL=['#ff2bd6','#b6ff00','#9d4dff','#ff8a00'], stars=[], mobs=[], shots=[], booms=[], fireT=0.8;
  function size(){ var r=gate.getBoundingClientRect(); D=Math.min(window.devicePixelRatio||1,2); W=Math.max(1,r.width); H=Math.max(1,r.height); cv.width=Math.round(W*D); cv.height=Math.round(H*D); }
  function seed(){ stars=[]; for(var i=0;i<90;i++) stars.push({x:Math.random(),y:Math.random()*0.62,r:Math.random()*1.4+0.3,p:Math.random()*6}); mobs=[]; for(var j=0;j<6;j++) mobs.push(mob(Math.random()*0.5)); }
  function mob(y){ return {x:0.1+Math.random()*0.8,y:y==null?-0.05:y,v:0.025+Math.random()*0.03,s:7+Math.random()*7,c:COL[(Math.random()*COL.length)|0],r:Math.random()*6,k:(Math.random()*3)|0}; }
  function shape(x,y,s,c,r,k){ g.save(); g.translate(x,y); g.rotate(r); g.strokeStyle=c; g.shadowColor=c; g.shadowBlur=12; g.lineWidth=1.8; g.beginPath();
    var n=k===0?3:k===1?4:6; for(var i=0;i<=n;i++){ var a=i/n*6.2832-1.5708; if(i) g.lineTo(Math.cos(a)*s,Math.sin(a)*s); else g.moveTo(Math.cos(a)*s,Math.sin(a)*s); } g.stroke(); g.restore(); }
  function draw(now){
    var t=(now-t0)/1000, dt=Math.min(0.05,(now-last)/1000||0); last=now;
    g.setTransform(D,0,0,D,0,0); g.fillStyle='#05030c'; g.fillRect(0,0,W,H);
    var hz=H*0.64, cx=W/2;
    var sky=g.createLinearGradient(0,0,0,hz); sky.addColorStop(0,'rgba(157,77,255,0)'); sky.addColorStop(1,'rgba(255,43,214,.16)'); g.fillStyle=sky; g.fillRect(0,0,W,hz);
    for(var i=0;i<stars.length;i++){ var st=stars[i]; g.fillStyle='rgba(170,215,255,'+(0.25+0.35*Math.sin(t*1.5+st.p))+')'; g.beginPath(); g.arc(st.x*W,st.y*H,st.r,0,6.2832); g.fill(); }
    /* horizon grid scrolling toward the viewer */
    g.save(); g.shadowColor='#ff2bd6'; g.shadowBlur=8; g.lineWidth=1.2;
    g.strokeStyle='rgba(255,43,214,.75)'; g.beginPath(); g.moveTo(0,hz); g.lineTo(W,hz); g.stroke();
    var off=(t*0.35)%1; for(var r=0;r<14;r++){ var q=(r+off)/14, y=hz+(H-hz)*q*q; g.strokeStyle='rgba(255,43,214,'+(0.12+0.55*q)+')'; g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
    g.strokeStyle='rgba(0,240,255,.35)'; g.shadowColor='#00f0ff'; for(var v=-12;v<=12;v++){ g.beginPath(); g.moveTo(cx+v*W*0.02,hz); g.lineTo(cx+v*W*0.16,H); g.stroke(); }
    g.restore();
    /* raiders drift down; a turret at the horizon picks them off */
    var tx=cx, ty=hz-4; fireT-=dt;
    for(var m=0;m<mobs.length;m++){ var o=mobs[m]; if(!still){ o.y+=o.v*dt; o.r+=dt*0.8; } if(o.y>0.58) mobs[m]=mob(); shape(o.x*W,o.y*H,o.s,o.c,o.r,o.k); }
    if(!still&&fireT<=0&&mobs.length){ var best=null; for(var b=0;b<mobs.length;b++) if(mobs[b].y>0.08&&(!best||mobs[b].y>best.y)) best=mobs[b];
      if(best){ shots.push({x0:tx,y0:ty,x1:best.x*W,y1:best.y*H,l:0.18,c:best.c}); booms.push({x:best.x*W,y:best.y*H,l:0.6,c:best.c}); mobs[mobs.indexOf(best)]=mob(); } fireT=0.7+Math.random()*0.9; }
    g.save(); g.globalCompositeOperation='lighter';
    for(var s2=shots.length-1;s2>=0;s2--){ var sh=shots[s2]; sh.l-=dt; if(sh.l<=0){ shots.splice(s2,1); continue; } g.strokeStyle='rgba(174,248,255,'+(sh.l/0.18)+')'; g.shadowColor='#00f0ff'; g.shadowBlur=14; g.lineWidth=2.2; g.beginPath(); g.moveTo(sh.x0,sh.y0); g.lineTo(sh.x1,sh.y1); g.stroke(); }
    for(var k2=booms.length-1;k2>=0;k2--){ var bo=booms[k2]; bo.l-=dt; if(bo.l<=0){ booms.splice(k2,1); continue; } var f=1-bo.l/0.6; g.strokeStyle=bo.c; g.shadowColor=bo.c; g.shadowBlur=16; g.globalAlpha=1-f; g.lineWidth=2; g.beginPath(); g.arc(bo.x,bo.y,4+f*34,0,6.2832); g.stroke(); g.beginPath(); g.arc(bo.x,bo.y,2+f*16,0,6.2832); g.stroke(); g.globalAlpha=1; }
    g.restore();
    g.save(); g.strokeStyle='#00f0ff'; g.shadowColor='#00f0ff'; g.shadowBlur=12; g.lineWidth=2; g.beginPath(); g.arc(tx,ty+4,12,Math.PI,0); g.stroke(); g.restore();
    if(!still&&!gate.hidden) raf=requestAnimationFrame(draw); else raf=0;
  }
  function start(){ if(gate.hidden||raf) return; size(); t0=last=performance.now(); raf=requestAnimationFrame(draw); }
  seed(); start();
  window.addEventListener('resize',function(){ if(!gate.hidden) size(); });
  if(window.MutationObserver) new MutationObserver(start).observe(gate,{attributes:true,attributeFilter:['hidden']});
})();
</script>

(function(){

/* ================= constants ================= */
const W=600, H=800, GROUND=732, TURRET_Y=GROUND-14, BS=640, LEVELS=50;
const TY=()=>TURRET_Y+arc(T.x);
const BARREL_SPREAD=0.0595, TUR_RANGE=640;   /* angle between barrels (was 0.085, 30% tighter so volleys leave fewer gaps); the auto turret only engages things this close to its muzzle */

const G={state:'armory',tools:{},mort:2,mortT:0,saws:[],bolts:[],shells:[],fires:[],delay:[],pickQ:0,rerolls:1,offer:[],superOn:0,superCd:10,chainT:2,sawCd:0,stormT:12,credits:0,boost:{},pot:0,bm:1,n:1,wave:1,NW:20,nextT:null,span:12,wFac:1,tag:null,speed:1,mode:'auto',hp:100,maxHp:100,earned:0,kills:0,hpS:1,spS:1,cs:1,
  enemies:[],bullets:[],parts:[],rings:[],floats:[],mines:[],fields:[],events:[],waveT:0,shake:0,time:0,boss:null,
  armed:null,ghost:{x:W/2,y:500,show:false},placing:false,stock:0,mineT:0,fieldCd:0,autoT:0};
const T={x:W/2,cool:0,recoil:0,target:null};
const input={x:W/2,active:false};
/* ================= weapon control =================
   Every weapon is AI-driven. Press and hold a weapon icon to freeze its AI, drag onto the field, release to fire there.
   A weapon that is still recharging keeps your aim pinned and fires the moment it is ready, then the AI takes over again.
   Any weapon, or all of them, can be set to Manual (settings gear or the Aim button in battle): then the AI never fires it. */
const CTLK='nd_ctl_v1', WCTL=['turret','mine','field','chain','saw','mortar'].filter(w=>!shelved(w));
const WCOL={turret:C.cyan,mine:C.orange,field:C.violet,chain:C.yellow,saw:C.lime,mortar:C.amber};
const CTL={all:false,w:{}};
try{ const j=JSON.parse(NDStore.get(CTLK)||'null'); if(j){ CTL.all=!!j.all; for(const k of WCTL) if(j.w&&j.w[k]) CTL.w[k]=1; } }catch(e){}
function ctlSave(){ NDStore.set(CTLK,JSON.stringify(CTL)); toolKey=''; }
const isManual=w=>!!(CTL.all||CTL.w[w]);
const GR={w:null,live:false,x:W/2,y:GROUND-200,out:false,tm:0,hadPin:false,sup:false,pid:-1};
G.pin={};
const held=w=>GR.w===w||!!G.pin[w];
const aiOff=w=>isManual(w)||held(w);
function wReady(w){
  if(!hasTool(w)) return false;
  if(w==='mine') return canMine();
  if(w==='field') return canField();
  if(w==='mortar') return canMortar();
  if(w==='chain') return !G.cpend&&G.chainT<=0.05;
  if(w==='saw') return G.saws.length<1+bst('scount')&&G.sawCd<=0;
  return false;
}
function chainSnap(x,y){ let b=null, bd=230; for(const e of G.enemies){ if(e.dead||e.y<30) continue; const d=Math.hypot(e.x-x,e.y-y); if(d<bd){ bd=d; b=e; } } return b; }
function fireWeaponAt(w,x,y){
  if(w==='mine') return placeMine(x,y);
  if(w==='field') return placeField(x,y);
  if(w==='mortar') return fireMortar(x,y);
  if(w==='chain'){ const tg=chainSnap(x,y); if(!tg) return false; G.cpend={e:tg,t:0.3,max:0.3,hits:chainPlan(tg)}; G.chainT=chainCd(); Music.place(true); return true; }
  if(w==='saw'){
    const a=clamp(Math.atan2(x-T.x,TY()-30-y),-1.25,1.25), r=ST.ssz(L('ssz'))*(bst('sbig')?1.6:1), life=ST.slife(L('sspd'))+2*bq('sspeed');
    G.saws.push({x:T.x,y:TY()-30,vx:Math.sin(a)*430,vy:-Math.cos(a)*430,r:r,life:life,max:life,rot:0}); G.sawCd=0.56; Music.place(false); return true;
  }
  return false;
}
/* a pinned aim fires as soon as its weapon is ready; the AI stays off that weapon until then */
function tickPins(dt){
  for(const w in G.pin){
    const p=G.pin[w]; p.t+=dt;
    if(GR.w===w) continue;
    if(wReady(w)){ if(fireWeaponAt(w,p.x,p.y)) delete G.pin[w]; else if(p.t>8) delete G.pin[w]; }
    else if(p.t>30) delete G.pin[w];
  }
}
function grabEnd(fire){
  const w=GR.w; if(!w) return;
  clearTimeout(GR.tm);
  if(fire&&GR.live){
    if(!(wReady(w)&&fireWeaponAt(w,GR.x,GR.y))) G.pin[w]={x:GR.x,y:GR.y,t:0};
    else { delete G.pin[w]; CF.fire++; }
    if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
  }
  GR.w=null; GR.live=false; toolKey='';
}
const WSHORT={turret:'Turret',mine:'Mines',field:'Field',chain:'Chain',saw:'Saw',mortar:'Mortar'};
function ctlHtml(){
  const rows=WCTL.map(w=>{ const on=isManual(w); return '<button type="button" class="cw'+(on?' man':'')+'" data-cw="'+w+'" aria-pressed="'+on+'" aria-label="'+WSHORT[w]+': '+(on?'manual':'auto')+'" style="--c:'+WCOL[w]+'">'+ico(w,18)+'<b>'+WSHORT[w]+'</b><i>'+(on?'Manual':'Auto')+'</i></button>'; }).join('');
  return '<h2 class="ch2">Weapon control</h2><p class="cnote">Auto means the AI fires the weapon for you. During a battle you can still hold a weapon icon and drag onto the field to aim a single shot yourself. Manual means the AI never fires the weapon, so you have to fire it yourself.</p>'
    +'<button type="button" class="call'+(CTL.all?' on':'')+'" data-call="1" aria-pressed="'+CTL.all+'">All weapons manual</button><div class="cgrid">'+rows+'</div>';
}
function ctlToggle(t){
  if(t.dataset.call){ CTL.all=!CTL.all; }
  else if(t.dataset.cw){ const w=t.dataset.cw;
    if(CTL.all){ CTL.all=false; WCTL.forEach(k=>{ if(k!==w) CTL.w[k]=1; }); delete CTL.w[w]; }
    else if(CTL.w[w]) delete CTL.w[w]; else CTL.w[w]=1; }
  ctlSave();
}

const keys={left:false,right:false};
const stars=[]; for(let i=0;i<130;i++) stars.push({x:Math.random()*W,y:Math.random()*(H+TOPMAX)-TOPMAX,r:rnd(0.5,1.5),ph:Math.random()*6.28});

/* ================= level and wave generation ================= */
const waveCount=n=>n%50===0?40:n%10===0?30:20;
const earlyDamp=n=>n<=5?0.5+0.1*(n-1):1;
const EHP=[0.55,0.65,0.9,1.05,1.1];
const earlyHp=n=>n<=5?EHP[n-1]:n<=14?2.0+0.17*(n-6):n<=24?3.36-0.236*(n-14):1;
const mobn=n=>Math.max(MOBF,MOBN*Math.pow(0.94,n-1)*earlyDamp(n));
let LATEK=0.01;
const LATEHP=1.25; /* +25% enemy health on every level after 6 */
const hpScale=n=>Math.pow(HPG,n-1)*(1+HPA*(n-1))*(1+LATEK*Math.pow(Math.max(0,n-12),2))*(n>6?LATEHP:1);
const waveBudget=(n,w,elite)=>1.4*(5.2+0.7*n)*(1+0.03*(w-1))*(elite?1.5:1);
function levelPoints(n){
  const NW=waveCount(n); let t=0;
  for(let w=1;w<=NW;w++){
    if(isBoss(n)&&w===NW){ t+=n%50===0?120:40; continue; }
    const elite=w%5===0&&w!==NW;
    t+=waveBudget(n,w,elite);
  }
  return t;
}
const bmOf=n=>levelPool(n)/levelPool(1)/(levelPoints(n)/levelPoints(1));
const levelPool=n=>Math.round(POOL0*Math.pow(POOLG,n-1)*(n%50===0?3:isBoss(n)?1.6:1));
const curUW=()=>(G.wd&&G.wd.uw)||UW;
function buildWave(n,w){
  const NW=waveCount(n), boss=isBoss(n), last=w===NW;
  const rng=mulberry(n*7919+w*131+7), R=(a,b)=>a+rng()*(b-a);
  const ev=[], add=(t,fn)=>ev.push({t:t,fn:fn});
  if(boss&&last){
    const mega=n%50===0;
    add(1.2,()=>{ G.boss=spawn('boss',W/2,-100,{mega:mega,r:mega?84:56,cr:Math.round((mega?150:50)*G.bm*1.5)}); say(mega?'Mega boss':skinName(G.wd.id,'boss'),mega?'Level '+n+' finale':'Destroy it.'); });
    return {ev:ev,span:9999,elite:true};
  }
  const elite=w%5===0&&!last, span=15+Math.min(5,n*0.1);
  if(n===1&&w===1){ for(let i=0;i<5;i++){ const t=0.8+i*2.6+R(0,0.8), x=R(60,W-60), vx=R(-10,10); add(t,()=>spawn('rock',x,-30,{vx:vx})); } return {ev:ev,span:span,elite:false}; }
  const prof=profileFor(G.wd,n,G.elite), mut=prof.mut;
  let budget=waveBudget(n,w,elite)*mobn(n)*(G.elite?1.2:1)*(mut==='armored'?0.85:mut==='dense'?1.2:1);
  const UWc=curUW(), sigs=(G.wd&&G.wd.sig)||[];
  let pool=prof.roster.filter(k=>UWc[k]!==undefined&&UWc[k]<=gpOf(n,w));
  if(!pool.length) pool=['rock'];
  const docs=G.elite?(prof.doc||[]):[], hasD=k=>docs.indexOf(k)>=0;
  const warpP=(mut==='warp'||prof.mut2==='warp'?0.5:0)+(hasD('ambush')?0.4:0), wyLo=hasD('ambush')?OZ_Y-200:90, wyHi=hasD('ambush')?OZ_Y-80:330;
  const vetO=type=>(hasD('veterans')&&type!=='swarm'&&type!=='invader'&&rng()<0.2)?{vet:1,vr:Math.floor(rng()*3)}:{};
  if(hasD('convoy')&&prof.cargo&&prof.carrier&&w>=2&&(w%2===0||elite)){
    const nc=1+Math.floor(n/20); budget-=14*nc;
    for(let i=0;i<nc;i++){ const t=1+span*0.5*rng(), x=R(90,W-90), ct=prof.carrier, cg=prof.cargo; add(t,()=>spawn(ct,x,-30,{vx:R(-8,8),carry:cg,vet:1,vr:Math.floor(Math.random()*3)})); }
  }
  const cost={rock:2,dart:3,chunk:6,swarm:5,shield:5,brute:12,phantom:5,leech:5,tender:7,egg:10,regen:7};
  let forms=0; const maxForms=Math.ceil((1+Math.floor(n/25))*mobn(n)/1.2);
  let guard=0;
  while(budget>0&&guard++<300){
    const wt=pool.map(k=>1+(gpOf(n,w)-UWc[k]<8?3:0)+(elite&&(cost[k]||9)>=5?2:0)+(sigs.indexOf(k)>=0?3:0)+(k===prof.feat?5:0)), tot=wt.reduce((a,b)=>a+b,0);
    let r=rng()*tot, type=pool[0];
    for(let i=0;i<pool.length;i++){ r-=wt[i]; if(r<=0){ type=pool[i]; break; } }
    const t=0.5+(span*0.8)*Math.pow(rng(),0.9);
    if(type==='invader'){
      const cols=Math.min(6,4+Math.floor(n/15)), rows=Math.min(4,1+Math.floor(n/14)), c=cols*rows*1.5;
      if(forms>=maxForms||c>budget) continue;
      forms++; budget-=c; const sp=36+n*0.7;
      add(t,()=>spawnFormation(cols,rows,sp,c));
      continue;
    }
    if(cost[type]>budget&&type!=='rock') type='rock';
    const pts=cost[type]; budget-=pts;
    const x=R(34,W-34), vx=R(-14,14);
    const warp=type==='phantom'||(warpP&&rng()<warpP), wy=R(wyLo,wyHi);
    if(type==='swarm'){
      const cnt=Math.min(5,2+Math.floor(n/12));
      if(warp) add(t,()=>{ for(let i=0;i<cnt;i++) warpIn('swarm',clamp(x+(i%3-1)*22,20,W-20),wy+Math.floor(i/3)*16,{}); });
      else add(t,()=>{ for(let i=0;i<cnt;i++) spawn('swarm',clamp(x+(i%3-1)*22,20,W-20),-14-i*13,{}); });
    } else if(warp){ const vo=vetO(type); add(t,()=>warpIn(type,clamp(x,40,W-40),wy,Object.assign({vx:type==='dart'||type==='shield'?0:vx},vo))); }
    else if(type==='egg') add(t,()=>spawn('egg',clamp(x,60,W-60),-30,{}));
    else if(hasD('pincer')&&type!=='dart'&&type!=='shield'&&type!=='leech'&&rng()<0.5){
      const side=rng()<0.5?-1:1, ex=side<0?30:W-30, pv=-side*R(55,85), vo=vetO(type);
      add(t,()=>spawn(type,ex,-30,Object.assign({vx:pv},vo)));
      if(budget>cost[type]){ budget-=cost[type]; const vo2=vetO(type); add(t,()=>spawn(type,W-ex,-30,Object.assign({vx:-pv},vo2))); }
    }
    else { const vo=vetO(type); add(t,()=>spawn(type,x,-30,Object.assign({vx:type==='dart'||type==='shield'||type==='leech'?0:vx},vo))); }
  }
  ev.sort((a,b)=>a.t-b.t);
  if(hasD('surge')){ const half=Math.floor(ev.length/2); ev.forEach((q,i)=>{ q.t=(i<half?0.8:span*0.55)+(q.t-0.5)*0.15; }); }
  return {ev:ev,span:span,elite:elite};
}

/* ================= combat record + achievements ================= */
/* Every weapon hit is tagged with its source (hurt(...,src)). A mob is "stopped" when it is destroyed, "through" when it reaches the base.
   Weapon success = of the mobs a weapon hit, the share that ended up destroyed. A weapon is off-type against a mob that takes
   RESISTED x or less from that weapon's main damage type (the same cut-off the Codex uses to flag a resist). */
const WLIST=['turret','mine','field','chain','saw','mortar'];
const WKIND={turret:'k',saw:'k',mine:'b',mortar:'b',field:'e',chain:'e'};
const WNAME={turret:'Turret',mine:'Mines',field:'Dimensional field',chain:'Chain lightning',saw:'Buzz saw',mortar:'Mortar'};
const RESISTED=0.65;
const TIER=[{n:'Bronze',c:'#cd7f32'},{n:'Silver',c:'#c4d0d8'},{n:'Gold',c:'#ffc400'},{n:'Platinum',c:'#7df9ff'}];
const stOf=()=>P.st||(P.st=newSt());
/* Awards are per world, so every count is also kept per world: s.pw[world] = {enc,kill,leak,rz,hold,w}. The global counters stay for the Record tab. */
const newPwb=()=>({enc:{},kill:{},leak:{},rz:{},hold:{},w:{},mk:{}});
const stWid=()=>(G.wd&&G.wd.id)||'belt';
function pwOf(wid){ const s=stOf(); s.pw=s.pw||{}; return s.pw[wid]||(s.pw[wid]=newPwb()); }
const fmtN=n=>Math.round(n).toLocaleString('en-US');
const NKT=50;   /* resisted killing blows a mob type needs before it counts toward the variety awards */
let achDirty=false, achLast=0, achQ=[], achEl=null, achBusy=false, ACHS=null;

function stSpawn(e){
  const s=stOf(), w=(G.wd&&G.wd.id)||'belt';
  s.enc[e.type]=(s.enc[e.type]||0)+1; (s.world[w]||(s.world[w]={}))[e.type]=1;
  { const q=pwOf(w); q.enc[e.type]=(q.enc[e.type]||0)+1; }
  if(e.y>=ozY(e.x)) e.ozx=1;   /* appeared below the ozone (warp-ins, formations): cannot be judged against it */
  achDirty=true; achCheck();
}
function stHit(e,src,kind,m){
  (e.wh||(e.wh={}))[src]=1;
  if(kind===WKIND[src]&&m<=RESISTED) (e.wn||(e.wn={}))[src]=1;
}
/* Called once per mob that dies to a weapon (won) or reaches the base (!won). Mobs cleared by a boss dying are not counted either way. */
function stResolve(e,won,src){
  const s=stOf(), t=e.type, q=pwOf(stWid());
  for(const r of [s,q]){ r.rz=r.rz||{}; r.hold=r.hold||{}; }
  if(won){ s.kill[t]=(s.kill[t]||0)+1; q.kill[t]=(q.kill[t]||0)+1; } else { s.leak[t]=(s.leak[t]||0)+1; q.leak[t]=(q.leak[t]||0)+1; }
  const held=won&&!e.oz;   /* held = destroyed above the ozone line */
  s.rz[t]=(s.rz[t]||0)+1; q.rz[t]=(q.rz[t]||0)+1; if(held){ s.hold[t]=(s.hold[t]||0)+1; q.hold[t]=(q.hold[t]||0)+1; }
  if(G.run){ G.run.rz[t]=(G.run.rz[t]||0)+1; if(held) G.run.hold[t]=(G.run.hold[t]||0)+1;
    if(won&&src){ const kw=G.run.kw||(G.run.kw={}); kw[src]=(kw[src]||0)+1; q.mk=q.mk||{}; if(kw[src]>(q.mk[src]||0)) q.mk[src]=kw[src]; } }   /* kills with each weapon this match; best per world is kept */
  if(e.wh) for(const w in e.wh){
    const n=e.wn&&e.wn[w];
    for(const r of [s,q]){
      const row=r.w[w]||(r.w[w]={}), a=row[t]||(row[t]=[0,0,0,0,0,0]);
      a[0]++; if(n) a[3]++;
      if(won){ a[1]++; if(n) a[4]++; if(w===src){ a[2]++; if(n) a[5]++; } }
    }
  }
  achDirty=true; achCheck();
}
/* Old saves: credit mobs per world from the levels already cleared there (same inference the Codex uses for pre-tracking saves). */
function stBackfill(){
  const s=stOf(); if(s.bf) return; s.bf=1;
  for(const wd of WORLDS){
    const b=((P.prog||{})[wd.id]||{}).best||0; if(!b) continue;
    const uw=wd.uw||UW, set=(s.world[wd.id]=s.world[wd.id]||{});
    for(const k in uw) if(MOB[k]&&Math.ceil(uw[k]/20)<=b) set[k]=1;
    if(set.chunk) set.small=1; if(set.egg) set.hatch=1; if(b>=10){ set.boss=1; set.orb=1; }
  }
}

/* One-time: saves from before per-world awards. The old global record becomes Meteor Belt's, and old unlocks carry over to Meteor Belt (already paid, never paid twice). */
function stPwMigrate(){
  const s=stOf(); if(s.pwm) return; s.pwm=1; s.pw=s.pw||{};
  const cp=o=>JSON.parse(JSON.stringify(o||{}));
  if((Object.keys(s.enc||{}).length||Object.keys(s.w||{}).length)&&!s.pw.belt) s.pw.belt={enc:cp(s.enc),kill:cp(s.kill),leak:cp(s.leak),rz:cp(s.rz),hold:cp(s.hold),w:cp(s.w)};
  for(const k of Object.keys(s.ach||{})) if(k.indexOf('@')<0&&k.indexOf('world_')!==0&&!s.ach[k+'@belt']) s.ach[k+'@belt']=s.ach[k];
}

/* ---- aggregates: one pass over the record per check (wid = one world's record; none = everything, for the Record tab) ---- */
function agg(wid){
  const S=stOf(), s=wid?((S.pw||{})[wid]||newPwb()):S, a={sight:0,kill:0,leak:0,rz:0,hold:0,cls:{},mob:{},wc:{},wt:{},mk:{},bm:{},nk:0,nkTypes:0,ne:0,nd:0}, types={};
  for(const c in CLS) a.cls[c]={enc:0,kill:0,leak:0,rz:0,hold:0};
  for(const k in MOB){
    const m={enc:s.enc[k]||0,kill:s.kill[k]||0,leak:s.leak[k]||0,rz:(s.rz||{})[k]||0,hold:(s.hold||{})[k]||0}; a.mob[k]=m; a.sight+=m.enc; a.kill+=m.kill; a.leak+=m.leak; a.rz+=m.rz; a.hold+=m.hold;
    const c=a.cls[MOB[k].cls]; c.enc+=m.enc; c.kill+=m.kill; c.leak+=m.leak; c.rz+=m.rz; c.hold+=m.hold;
  }
  for(const w of WLIST){
    a.wt[w]=[0,0,0,0,0,0]; a.wc[w]={}; for(const c in CLS) a.wc[w][c]=[0,0,0,0,0,0];
    a.mk[w]=(s.mk||{})[w]|0; a.bm[w]={n:0,k:''};
    const row=s.w[w]||{};
    for(const k in row){
      if(!MOB[k]) continue; const r=row[k]; if((r[2]|0)>a.bm[w].n) a.bm[w]={n:r[2]|0,k:k};
      for(let i=0;i<6;i++){ const v=r[i]||0; a.wt[w][i]+=v; a.wc[w][MOB[k].cls][i]+=v; }
      if((r[5]||0)>0) types[k]=(types[k]||0)+(r[5]|0);
    }
    a.ne+=a.wt[w][3]; a.nd+=a.wt[w][4]; a.nk+=a.wt[w][5];
  }
  a.nkTypes=Object.keys(types).filter(k=>types[k]>=NKT).length;
  return a;
}

/* ---- progress helpers: {done,frac,txt} ---- */
const clamp01=v=>v<0?0:v>1?1:v;
function pCount(v,t){ return {done:v>=t,frac:clamp01(v/t),txt:fmtN(Math.min(v,t))+' / '+fmtN(t)}; }
/* rate goals need a minimum sample so a lucky handful cannot unlock them; the bar fills to half on the sample, then to full on the rate */
function pRate(num,den,min,goal){
  if(den<min) return {done:false,frac:den/min*0.5,txt:fmtN(den)+' / '+fmtN(min)+' to qualify'};
  const r=num/den*100;
  return {done:r>=goal,frac:0.5+0.5*clamp01(r/goal),txt:r.toFixed(1)+'% of '+goal+'%'};
}

/* ---- economy knobs (one place) ---- */
const ECON={achGems:[5,10,20,40],achCry:[1,2,3,5],    /* free reward per achievement tier (awards take real effort, so they pay a little more) */
  starGems:[0,1,1],starCry:[1,1,2],fullGems:3,fullCry:3, /* per newly earned level star (clear, hold, featured mob) and the all-three bonus */
  gate:100};                                               /* stars needed in a world to open the next one */
/* Upgrade prices (build 107; tuned with a turret-only play simulation to about 1.5x to 2x the runs of build 106 to reach each level, with the same ceiling): priced in clears, scaled to how far you've played.
   One level of an upgrade costs UPC(stage) x depth x line weight "clears" of that crystal type, where a clear is what a first clear of your next
   level pays in that type. Stage = the furthest level reached in any world, so prices grow as you progress but stay a steady number of runs:
   early levels about UPC0 runs, late game about UPC1 runs, deeper levels of a line up to UPG times more. Short lines (Barrels, Forks) weigh more per level. */
const UPC0=1.2, UPC1=3, UPG=3.5;
/* ---- level stars: 1 = clear it, 2 = hold enough mobs above the ozone, 4 = hold 95% of the level's featured mob above the ozone ---- */
const starHold=n=>n<=10?0.8:n<=30?0.85:0.9;
const popc=b=>(b&1)+((b>>1)&1)+((b>>2)&1);
function starBitsFor(run,hold,feat){
  let rz=0,h=0; for(const k in run.rz){ rz+=run.rz[k]; h+=(run.hold||{})[k]||0; }
  const fr=run.rz[feat]||0, fh=(run.hold||{})[feat]||0; let b=1;
  if(!rz||h/rz>=hold) b|=2; if(!fr||fh/fr>=0.95) b|=4; return b;
}
function starsOfWorld(wid){ const q=((P.prog||{})[wid]||{}).stars||{}; let n=0; for(const k in q) n+=popc(q[k]|0); return n; }
function achReward(d){
  const g=ECON.achGems[d.tier]||0, f=ECON.achCry[d.tier]||0; P.gems=(P.gems||0)+g;
  let t=null; if(f){ t=typeof rollType==='function'?rollType():'pow'; cryAdd(t,f); }
  d.rw={g:g,f:f,t:t};
}
function achList(){
  if(ACHS) return ACHS;
  const A=[], keys=Object.keys(MOB);

  /* Weapons: six awards per weapon, Bronze / Silver / Gold. Three for kills with that weapon in one match, three for lifetime kills of a single mob type in this world.
     A level holds roughly 400 to 3,000 mobs (boss and elite levels more), so a match award means carrying a big level with that one weapon; Gold needs one of the world's biggest levels. */
  const WAW={
    turret:{m:["Hot Barrel","Gunnery Sergeant","Bullet Storm"],l:["Marksman","Sharpshooter","Ace Gunner"],mn:'the Turret'},
    mine:{m:["Trap Setter","Minefield","Boom Architect"],l:["Tripwire Pro","Demolition Crew","Blast Legend"],mn:'Mines'},
    field:{m:["Slow Burn","Time Dilator","Stasis Sovereign"],l:["Cold Snap","Deep Freeze","Absolute Zero"],mn:'the Field'},
    chain:{m:["Spark Gap","Storm Caller","Thunder God"],l:["Bug Zapper","Circuit Breaker","Live Wire"],mn:'Chain Lightning'},
    saw:{m:["Sharp Edge","Razor's Edge","Whirling Death"],l:["Gravel Grinder","Chop Shop","Blade Master"],mn:'the Saw'},
    mortar:{m:["Lobber","Artillery Ace","Rain of Fire"],l:["Crater Maker","Siege Breaker","Hive Hammer"],mn:'the Mortar'}
  };
  const WMK={turret:[1200,2000,2800],mine:[300,700,1200],field:[300,700,1200],chain:[300,700,1200],saw:[300,700,1200],mortar:[300,700,1200]},
        WLK={turret:[2000,8000,20000],mine:[500,2500,7500],field:[500,2500,7500],chain:[500,2500,7500],saw:[500,2500,7500],mortar:[500,2500,7500]};
  const WSH={turret:'Turret',mine:'Mine',field:'Field',chain:'Chain',saw:'Saw',mortar:'Mortar'};
  /* Every award exists once per world: id 'base@world', counted from that world's own record only. */
  WORLDS.forEach(wd=>{
    const wid=wd.id, wn=wd.name;
    const add=(cat,id,name,desc,tier,fn,icon,grp)=>A.push({cat:cat,id:id+'@'+wid,wid:wid,wname:wn,name:name,desc:desc,tier:tier,fn:fn,icon:icon||'eye',grp:grp||''});
    const set=new Set(Object.keys(wd.uw||UW).filter(k=>MOB[k])); if(set.has('chunk')) set.add('small'); if(set.has('egg')) set.add('hatch'); set.add('orb'); set.add('boss');
    const ks=[...set], seen=()=>stOf().world[wid]||{};
    const best=()=>(((P.prog||{})[wid]||{}).best)|0;

    /* Discovery: this world's roster, its mob classes, sightings here, and how far you have pushed */
    A.push({cat:'disc',id:'world_'+wid,wid:wid,wname:wn,name:wn+' Survey',desc:'Meet all '+ks.length+' mobs that appear in '+wn+'. The last ones only show up deep in the world.',tier:1,fn:()=>pCount(ks.filter(k=>seen()[k]).length,ks.length),icon:'world',grp:'survey'});
    for(const c in CLS){
      const kc=ks.filter(k=>MOB[k].cls===c); if(!kc.length) continue;
      add('disc','cls_'+c,CLSN[c]||CLS[c].name+' Survey','Meet every '+CLS[c].name+' mob in '+wn+': '+kc.map(k=>skinName(wid,k)).join(', ')+'.',0,()=>pCount(kc.filter(k=>seen()[k]).length,kc.length),'eye','class');
    }
    [[5000,'Spotter'],[25000,'Lookout'],[100000,'Watchtower'],[250000,'All-Seeing Rampart']].forEach((x,i)=>
      add('disc','sight'+i,x[1],'Encounter '+fmtN(x[0])+' mobs in '+wn+'.',i,a=>pCount(a.sight,x[0]),'eye','sight'));
    [[10,'Beachhead','Clear level 10 in '+wn+'.'],[25,'Holdout','Clear level 25 in '+wn+'.'],[LEVELS,'Conqueror','Clear level '+LEVELS+' in '+wn+'.']].forEach((x,i)=>
      add('disc','lv'+x[0],x[1],x[2],i,()=>pCount(best(),x[0]),'world','conquest'));
    add('disc','stars',wn+' Perfected','Earn all '+(LEVELS*3)+' stars in '+wn+'.',3,()=>pCount(starsOfWorld(wid),LEVELS*3),'world','conquest');

    /* Weapons */
    WLIST.filter(w=>!shelved(w)).forEach(w=>{
      const T=WAW[w];
      [0,1,2].forEach(t=>{
        const mk=WMK[w][t], lk=WLK[w][t];

  if(bst('super')>0){ if(G.superOn>0) G.superOn-=dt; else { G.superCd-=dt; if(G.superCd<=0){ G.superOn=4; G.superCd=22-3*bst('super'); float(T.x,TY()-60,'SUPERCHARGE',C.yellow); G.rings.push({x:T.x,y:TY()-14,r:10,max:90,life:0.5,t:0,color:C.yellow}); } } }
  if(input.active){
    /* player is holding a finger on the field: they steer, the turret keeps firing */
    T.target=null; T.idle=0;
    const st=slide*dt; T.x+=clamp(input.x-T.x,-st,st);
    if(T.cool<=0&&G.enemies.some(e=>!e.dead&&e.y>0)) fire(null);
  } else if(isManual('turret')){
    /* manual turret: it holds fire and position until the player steers it */
    T.target=null; T.idle=0;
  } else {
    const tg=pickTarget(); T.target=tg;
    let aim=W/2;
    if(tg) aim=aimFor(tg);
    const st=slide*dt*(tg?1:0.5); T.x+=clamp(aim-T.x,-st,st);
    if(T.cool<=0){
      let ht=inLine(tg);
      if(!ht&&tg&&hitsFrom(tg,2.2)) ht=tg;                      /* nearly lined up: a volley will still clip it */
      if(ht){ fire(ht); T.idle=0; }
      else if(tg){ T.idle=(T.idle||0)+dt; if(T.idle>0.06){ fire(null); T.idle=0; } }   /* something is in range and we are still slewing: keep shooting rather than sit idle (unaimed, so it is not counted as a kill in flight) */
    } else T.idle=0;
  }
  T.x=clamp(T.x,20,W-20);
}

function chainCd(){ return Math.max(0.3,ST.ccool(L('ccool'))*Math.pow(0.85,bq('crate')))/CHAIN_SPD; }
function mineMax(){ return ST.mstock(L('mstock'))+2*bst('mcount'); }
function mineR(){ return ST.mrad(L('mrad'))*Math.pow(1.35,bq('marea')); }
function fieldHW(){ return ST.fwid(L('fwid'))*(1+0.2*bq('fwidb')); }
function canMine(){ return hasTool('mine')&&G.stock>=1; }

function supportOK(e){ return e!==T.target&&Math.abs(e.x-T.x)>26+e.r*0.7; }
function canField(){ return hasTool('field')&&G.fieldCd<=0&&G.fields.length<1+bst('fcount'); }
function placeMine(x,y){
  if(!canMine()) return false;
  const n=Math.min(1+bst('mcount'),G.stock);
  for(let i=0;i<n;i++){ G.stock--; G.mines.push({x:clamp(x+(i-(n-1)/2)*46,24,W-24),y:clamp(y+(i%2?16:0),200,GROUND-50),t:0,dead:false}); }
  Music.place(false); return true;
}
function placeField(x,y){
  if(!canField()) return false;
  const hw=fieldHW();
  G.fields.push({x:clamp(x,hw*0.4,W-hw*0.4),y:clamp(y,140,GROUND-100),hw:hw,h:22,t:0,dur:ST.fdur(L('fdur'))+2*bq('fdurc'),zapT:0.4,slow:Math.max(0.05,ST.fslow(fslowLv(L('fdps')))*Math.pow(0.85,bst('fchill'))),dps:ST.fdps(L('fdps'))*Math.pow(1.4,bq('field'))});
  G.fieldCd=G.fields.length<1+bst('fcount')?1.5:ST.frech(L('frech')); Music.place(true); return true;
}

/* AI placement rule: defend the ozone line from above. Ground weapons (mines, fields, mortar shells) only land below it when the shield is down to 10% and a mob is already at the line or about to cross it. */

   A mob whose health is covered by a shell in flight or a lightning strike that is charging is "spoken for" and left out of every other weapon's count.
   A second weapon only commits to an area when there is still more health there than the first one will remove. */
const mortShellDmg=()=>ST.mortdmg(L('mortdmg'))*Math.pow(1.4,bq('mortpow'))*(bst('mortbust')?1+1.4*bst('mortbust'):1);

function update(dt){

  while(G.events.length&&G.events[0].t<=G.waveT) G.events.shift().fn();
  if(!G.events.length){

    else {

      if(G.nextT!==null){ G.nextT-=dt; if(G.nextT<=0) startWave(G.wave+1); }

  { const csl=G.cm&&G.cm.slowT>0?G.cm.slowF:1; for(const e of G.enemies){ e.slow=1; if(e.frz>0){ e.frz-=dt; e.slow=0.04; } else if(csl<1) e.slow=csl; } }

  if(G.chips){ for(const c of G.chips){ c.life-=dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.vx*=0.97; c.vy=c.vy*0.97+40*dt; c.rot+=c.vr*dt; } G.chips=G.chips.filter(c=>c.life>0); }

/* level drops: each drop rolls a crystal type and a luck tier, and pays CVAL crystals of that type. Returns {type: crystals}. */
function awardCards(count,n,bonus,el){
  const got={}, add=(t,v)=>{ got[t]=(got[t]||0)+v; };
  for(let i=0;i<count;i++) add(rollType(),CVAL[rollRar(n,el)]);
  for(let i=0;i<bonus;i++) add(rollType(),CVAL[topRar(n,el)]);
  /* starter support: the first five levels always drop extra crystals of the types the turret upgrades with (damage, fire rate, barrels) */
  if(n<=5&&!el){ const tw=[['pow',4],['tmp',3],['cap',2]]; for(let i=0;i<2;i++){ let x=Math.random()*9, t='pow'; for(const q of tw){ x-=q[1]; if(x<=0){ t=q[0]; break; } } add(t,1); } }

}

const upCost=(u,lv,n)=>{ n=n||upStage(); const c=(UPC0+(UPC1-UPC0)*(n-1)/(LEVELS-1))*Math.min(3,Math.sqrt(25/u.max))*Math.pow(UPG,lv/u.max)*typeClear(u.ty,n); return Math.max(3,niceN(c)); };   /* crystals of the upgrade's type for the next level */
